<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Moses B2 Storage Inventory</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #13202b; }
    h1 { margin-bottom: 6px; }
    .note { color: #52606d; margin-bottom: 20px; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: #0e7490; color: white; font-weight: 700; cursor: pointer; margin-right: 8px; }
    button:disabled { opacity: .5; cursor: default; }
    .status { margin: 16px 0; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
    th, td { border: 1px solid #d8dee4; padding: 8px; vertical-align: top; text-align: left; }
    th { background: #f3f7f9; }
    code { white-space: pre-wrap; overflow-wrap: anywhere; }
    .ok { color: #166534; font-weight: 700; }
    .bad { color: #b91c1c; font-weight: 700; }
    details { margin-top: 16px; }
    pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 10px; overflow: auto; max-height: 520px; }
  </style>
</head>
<body>
  <h1>Moses B2 — Firebase Storage Inventory</h1>
  <div class="note">Temporary, read-only diagnostic page. It only lists Firebase Storage objects and resolves their download URLs. It never writes, renames, uploads or deletes files.</div>
  <button id="scan">Scan Moses B2</button>
  <button id="copy" disabled>Copy JSON</button>
  <div id="status" class="status">Ready.</div>
  <div id="summary"></div>
  <table>
    <thead><tr><th>Chapter</th><th>Image</th><th>English audio</th><th>Arabic audio</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <details><summary>Full JSON manifest</summary><pre id="json">Run the scan first.</pre></details>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js';
    import { getDownloadURL, getStorage, listAll, ref } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-storage.js';

    const firebaseConfig = {
      projectId: 'gen-lang-client-0373200489',
      appId: '1:603844754803:web:e9584b83ee6afcc1c25906',
      apiKey: 'AIzaSyDmavhrByoyP86t9FpR1oiDtHwl5jDSXwM',
      authDomain: 'gen-lang-client-0373200489.firebaseapp.com',
      storageBucket: 'gen-lang-client-0373200489.firebasestorage.app',
      messagingSenderId: '603844754803'
    };

    const storage = getStorage(initializeApp(firebaseConfig));
    const folders = {
      images: ['Moses/b2/images', 'Moses/moses_b2/images', 'moses/b2/images', 'moses/moses_b2/images'],
      englishAudio: ['Moses/b2/audio', 'moses/b2/audio', 'Moses/moses_b2/audio', 'moses/moses_b2/audio'],
      arabicAudio: ['Moses/b2/audio/arabic_audio', 'moses/b2/audio/arabic_audio', 'Moses/moses_b2/audio/arabic_audio', 'moses/moses_b2/audio/arabic_audio']
    };
    const expectedCount = 24;
    const imageExt = /\.(png|jpe?g|webp|avif|gif)$/i;
    const audioExt = /\.(mp3|m4a|aac|wav|ogg|opus|mpeg)$/i;

    function parseChapterNumber(name) {
      const decoded = decodeURIComponent(name);
      const chapterMatch = decoded.match(/chapter\s*[-_ ]?\s*(\d+)/i);
      if (chapterMatch) return Number.parseInt(chapterMatch[1], 10);
      const shortMatch = decoded.match(/(?:\b|_)ch\s*[-_ ]?\s*(\d+)/i);
      if (shortMatch) return Number.parseInt(shortMatch[1], 10);
      const cleaned = decoded.replace(/\b[ab][12]\b/i, '').replace(/^[ab][12]\s*[-_ ]?\s*/i, '');
      const numeric = cleaned.match(/(\d+)/);
      return numeric ? Number.parseInt(numeric[1], 10) : null;
    }

    async function scanRole(role, candidateFolders, kind) {
      const selected = {};
      const candidates = {};
      const unavailableFolders = [];
      const unresolvedFiles = [];
      const ext = kind === 'image' ? imageExt : audioExt;
      for (let priority = 0; priority < candidateFolders.length; priority++) {
        const folder = candidateFolders[priority];
        let listing;
        try { listing = await listAll(ref(storage, folder)); }
        catch (error) { unavailableFolders.push({ folder, error: String(error?.message ?? error) }); continue; }
        const items = [...listing.items].filter(item => ext.test(item.name)).sort((a,b) => a.name.localeCompare(b.name));
        for (const item of items) {
          const chapter = parseChapterNumber(item.name);
          if (chapter == null) continue;
          let downloadUrl = '';
          try { downloadUrl = await getDownloadURL(item); }
          catch (error) { unresolvedFiles.push({ fullPath: item.fullPath, error: String(error?.message ?? error) }); continue; }
          const asset = { role, chapter, priority, folder, name: item.name, fullPath: item.fullPath, downloadUrl };
          (candidates[chapter] ??= []).push(asset);
          if (!selected[chapter]) selected[chapter] = asset;
        }
      }
      return { selected, candidates, unavailableFolders, unresolvedFiles };
    }

    function cell(asset, count) {
      if (!asset) return '<span class="bad">MISSING</span>';
      const extra = count > 1 ? `<div class="bad">${count} candidates</div>` : '<div class="ok">1 selected</div>';
      return `${extra}<code>${asset.fullPath}</code><br><a href="${asset.downloadUrl}" target="_blank" rel="noreferrer">open</a>`;
    }

    let latestManifest = null;
    const scanButton = document.getElementById('scan');
    const copyButton = document.getElementById('copy');
    const status = document.getElementById('status');
    const rows = document.getElementById('rows');
    const json = document.getElementById('json');
    const summary = document.getElementById('summary');

    scanButton.addEventListener('click', async () => {
      scanButton.disabled = true; copyButton.disabled = true; status.textContent = 'Scanning Firebase Storage…'; rows.innerHTML = ''; summary.innerHTML = '';
      try {
        const [images, englishAudio, arabicAudio] = await Promise.all([
          scanRole('image', folders.images, 'image'),
          scanRole('englishAudio', folders.englishAudio, 'audio'),
          scanRole('arabicAudio', folders.arabicAudio, 'audio')
        ]);
        const chapters = [];
        for (let chapter = 1; chapter <= expectedCount; chapter++) {
          const row = { chapter, image: images.selected[chapter] ?? null, englishAudio: englishAudio.selected[chapter] ?? null, arabicAudio: arabicAudio.selected[chapter] ?? null };
          chapters.push(row);
          const tr = document.createElement('tr');
          tr.innerHTML = `<td><strong>${chapter}</strong></td><td>${cell(row.image, images.candidates[chapter]?.length ?? 0)}</td><td>${cell(row.englishAudio, englishAudio.candidates[chapter]?.length ?? 0)}</td><td>${cell(row.arabicAudio, arabicAudio.candidates[chapter]?.length ?? 0)}</td>`;
          rows.appendChild(tr);
        }
        latestManifest = {
          generatedAt: new Date().toISOString(),
          book: { storyId: 'musa', level: 'B2', expectedChapters: Array.from({ length: expectedCount }, (_, i) => i + 1) },
          configuredFolders: folders,
          chapters,
          diagnostics: {
            missing: {
              images: chapters.filter(x => !x.image).map(x => x.chapter),
              englishAudio: chapters.filter(x => !x.englishAudio).map(x => x.chapter),
              arabicAudio: chapters.filter(x => !x.arabicAudio).map(x => x.chapter)
            },
            duplicateCandidates: {
              images: Object.entries(images.candidates).filter(([,v]) => v.length > 1),
              englishAudio: Object.entries(englishAudio.candidates).filter(([,v]) => v.length > 1),
              arabicAudio: Object.entries(arabicAudio.candidates).filter(([,v]) => v.length > 1)
            },
            sameEnglishArabicAudio: chapters.filter(x => x.englishAudio?.downloadUrl && x.englishAudio.downloadUrl === x.arabicAudio?.downloadUrl).map(x => x.chapter),
            unavailableFolders: { images: images.unavailableFolders, englishAudio: englishAudio.unavailableFolders, arabicAudio: arabicAudio.unavailableFolders },
            unresolvedFiles: { images: images.unresolvedFiles, englishAudio: englishAudio.unresolvedFiles, arabicAudio: arabicAudio.unresolvedFiles }
          }
        };
        const missing = latestManifest.diagnostics.missing;
        summary.innerHTML = `<strong>Images:</strong> ${expectedCount - missing.images.length}/${expectedCount} &nbsp; <strong>EN audio:</strong> ${expectedCount - missing.englishAudio.length}/${expectedCount} &nbsp; <strong>AR audio:</strong> ${expectedCount - missing.arabicAudio.length}/${expectedCount}`;
        json.textContent = JSON.stringify(latestManifest, null, 2);
        status.textContent = 'Scan complete.'; copyButton.disabled = false;
      } catch (error) { status.textContent = `Scan failed: ${String(error?.message ?? error)}`; }
      finally { scanButton.disabled = false; }
    });

    copyButton.addEventListener('click', async () => {
      if (!latestManifest) return;
      await navigator.clipboard.writeText(JSON.stringify(latestManifest, null, 2));
      status.textContent = 'JSON copied to clipboard.';
    });
  </script>
</body>
</html>

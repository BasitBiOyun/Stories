# Preview continuous deployment: GitHub preview branch -> Cloud Build -> Cloud Run.
# The trigger should point at this file and match only the `preview` branch.
# This uses Google Cloud build minutes, not GitHub Actions minutes.

substitutions:
  _REGION: us-west1
  _AR_REPOSITORY: cloud-run-source-deploy
  _IMAGE: stories-preview
  _SERVICE: stories-preview

steps:
  # Pull the previous preview image so unchanged Docker layers can be reused.
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - >-
        docker pull
        ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE}:latest
        || true

  # Keep the GitHub Check Run useful even when Docker/BuildKit emits a very large
  # log (Vivliostyle is especially noisy on a cold build). Capture the full build
  # locally and publish only the diagnostic tail on failure.
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -ceu
      - |
        set +e
        docker build \
          --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE}:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE}:$COMMIT_SHA \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE}:latest \
          . > /tmp/docker-build.log 2>&1
        status=$$?
        set -e
        if [ "$$status" -ne 0 ]; then
          echo "Docker build failed (exit $$status). Last 250 lines follow:"
          tail -n 250 /tmp/docker-build.log
          exit "$$status"
        fi
        echo "Docker build succeeded. Last 80 lines:"
        tail -n 80 /tmp/docker-build.log

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - >-
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
        && docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE}:latest

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --quiet
      - --update-env-vars=APP_GIT_SHA=$COMMIT_SHA,APP_GIT_REF=$BRANCH_NAME
      - --update-labels=git-sha=$SHORT_SHA,deployed-by=cloud-build

# A user-selected trigger service account requires an explicit user-owned log sink.
# Cloud Logging satisfies that requirement without creating/managing a GCS bucket.
options:
  logging: CLOUD_LOGGING_ONLY

# Keep enough room for a cold PDF-producing build. Cached incremental builds
# should be substantially shorter.
timeout: 1200s

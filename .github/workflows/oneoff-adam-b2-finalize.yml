name: One-off Adam B2 finalization

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/oneoff-adam-b2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Canonicalize Adam B2 English value labels
        run: |
          python - <<'PY'
          from pathlib import Path

          teacher = Path('src/data/adam/b2/en/teacherGuide.ts')
          text = teacher.read_text(encoding='utf-8')
          replacements = {
              'D14 Saygı': 'D14 Respect',
              'D16 Sorumluluk': 'D16 Responsibility',
              'D6 Dürüstlük': 'D6 Honesty',
              'D10 Mütevazılık': 'D10 Humility',
              'D5 Duyarlılık': 'D5 Sensitivity',
              'D20 Yardımseverlik': 'D20 Helpfulness',
              'D12 Sabır': 'D12 Patience',
              'D9 Merhamet': 'D9 Compassion',
          }
          for source, target in replacements.items():
              text = text.replace(source, target)
          teacher.write_text(text, encoding='utf-8')

          pages = Path('src/data/adam/b2/en/pages.ts')
          pages_text = pages.read_text(encoding='utf-8')
          pages_text = pages_text.replace("import { normalizeAdamB2TeacherGuideValueLabels } from './teacherGuideValueLabels';\n", '')
          pages_text = pages_text.replace("\nnormalizeAdamB2TeacherGuideValueLabels();\n", '')
          pages.write_text(pages_text, encoding='utf-8')

          helper = Path('src/data/adam/b2/en/teacherGuideValueLabels.ts')
          if helper.exists():
              helper.unlink()
          PY

      - name: Verify no Turkish value labels remain
        run: |
          if grep -nE 'D14 Saygı|D16 Sorumluluk|D6 Dürüstlük|D10 Mütevazılık|D5 Duyarlılık|D20 Yardımseverlik|D12 Sabır|D9 Merhamet' src/data/adam/b2/en/teacherGuide.ts; then
            echo 'Turkish TYMM value labels still remain in Adam B2 English teacher guide.'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Remove one-off workflow
        run: rm -f .github/workflows/oneoff-adam-b2-finalize.yml

      - name: Commit finalized Adam B2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/adam/b2/en/teacherGuide.ts src/data/adam/b2/en/pages.ts
          git add -u -- src/data/adam/b2/en/teacherGuideValueLabels.ts .github/workflows/oneoff-adam-b2-finalize.yml
          git commit -m 'Finalize Adam B2 English value labels and QA'
          git push origin HEAD:preview

name: Finalize Adam B2 source pages

on:
  push:
    branches: [preview]
    paths:
      - .github/workflows/temporary-b2-consolidation.yml

permissions:
  contents: write

jobs:
  finalize-adam-b2:
    if: github.event.head_commit.message == 'Run Adam B2 source consolidation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize effective Adam B2 pages into source files
        shell: bash
        run: |
          cat > /tmp/flatten-adam-b2.ts <<'TS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const root = process.cwd();
          const indexPath = path.join(root, 'src/data/adam/b2/index.ts');
          const mod = await import(pathToFileURL(indexPath).href);
          const englishPages = mod.adamB2BookDataEn.pages;
          const arabicPages = mod.adamB2BookDataAr.pages;

          const storyIds = Array.from({ length: 17 }, (_, i) => i + 1);
          const expectedAllIds = Array.from({ length: 22 }, (_, i) => i + 1);

          function assert(condition: unknown, message: string): asserts condition {
            if (!condition) throw new Error(message);
          }

          function validatePages(pages: any[], label: string) {
            assert(Array.isArray(pages), `${label}: pages is not an array`);
            assert(pages.length === 22, `${label}: expected 22 total pages, got ${pages.length}`);
            assert(JSON.stringify(pages.map((p) => p.id)) === JSON.stringify(expectedAllIds), `${label}: page IDs/order mismatch`);
            for (const id of storyIds) {
              const page = pages[id - 1];
              assert(page.type === 'story', `${label} ch${id}: not a story page`);
              assert(typeof page.content === 'string' && page.content.trim().length > 0, `${label} ch${id}: empty prose`);
              assert(Array.isArray(page.vocabulary) && page.vocabulary.length === 5, `${label} ch${id}: expected 5 vocabulary items`);
              assert(Array.isArray(page.hotspots) && page.hotspots.length === 2, `${label} ch${id}: expected 2 hotspots`);
              assert(!page.animatedWords || page.animatedWords.length === 0, `${label} ch${id}: animatedWords must be disabled`);
              assert(typeof page.audioUrl === 'string' && page.audioUrl.length > 0, `${label} ch${id}: missing narration`);
              if (id <= 5) assert(page.image === '', `${label} ch${id}: missing real image must stay blank`);
              else assert(typeof page.image === 'string' && page.image.includes('adam_b2%2Fimages%2F'), `${label} ch${id}: real Adam B2 image missing`);
              assert(!String(page.image || '').includes('picsum'), `${label} ch${id}: Picsum placeholder found`);
              assert(!String(page.image || '').includes('adam_b1'), `${label} ch${id}: Adam B1 image fallback found`);
            }
          }

          validatePages(englishPages, 'EN');
          validatePages(arabicPages, 'AR');
          for (const id of storyIds) {
            const en = englishPages[id - 1];
            const ar = arabicPages[id - 1];
            assert(en.image === ar.image, `ch${id}: EN/AR image mismatch`);
            assert(en.vocabulary.length === ar.vocabulary.length, `ch${id}: bilingual vocabulary count mismatch`);
            assert(en.audioUrl !== ar.audioUrl, `ch${id}: EN and AR narration must not be the same file`);
            assert(en.hotspots[0].x === ar.hotspots[0].x && en.hotspots[0].y === ar.hotspots[0].y, `ch${id}: hotspot 1 coordinate mismatch`);
            assert(en.hotspots[1].x === ar.hotspots[1].x && en.hotspots[1].y === ar.hotspots[1].y, `ch${id}: hotspot 2 coordinate mismatch`);
          }

          function cleanedStoryPages(pages: any[]) {
            return pages.slice(0, 17).map((page) => {
              const copy = { ...page };
              delete copy.exercises;
              delete copy.languageFocusExercises;
              delete copy.animatedWords;
              return copy;
            });
          }

          function basePage(page: any, drops: string[]) {
            const copy = { ...page };
            for (const key of drops) delete copy[key];
            delete copy.animatedWords;
            return copy;
          }

          const json = (value: unknown) => JSON.stringify(value, null, 2);

          function renderPages(isArabic: boolean, pages: any[]) {
            const stories = cleanedStoryPages(pages);
            const p18 = basePage(pages[17], ['exercises']);
            const p19 = basePage(pages[18], ['exercises']);
            const p20 = basePage(pages[19], ['vocabularyPairs', 'vocabulary']);
            const p21 = basePage(pages[20], ['vocabulary']);
            const p22 = basePage(pages[21], ['exercises']);

            const exerciseImports = isArabic
              ? `import { adamB2QuickChallengesAr, adamB2KnowledgeCheckExercisesAr, adamB2VocabularyChallengePairsAr, adamB2LanguageReviewExercisesAr, adamB2FinalChallengeExercisesAr } from './exercises';`
              : `import { adamB2QuickChallenges, adamB2KnowledgeCheckExercises, adamB2VocabularyChallengePairs, adamB2LanguageReviewExercises, adamB2FinalChallengeExercises } from './exercises';`;
            const focusImports = isArabic
              ? `import { adamB2LanguageFocusExercisesAr } from './languageFocus';\nimport { adamB2LanguageFocusExercisesArPart2 } from './languageFocus2';\nimport { adamB2LanguageFocusExercisesArPart3 } from './languageFocus3';`
              : `import { adamB2LanguageFocusExercises } from './languageFocus';\nimport { adamB2LanguageFocusExercisesPart2 } from './languageFocus2';\nimport { adamB2LanguageFocusExercisesPart3 } from './languageFocus3';`;
            const quick = isArabic ? 'adamB2QuickChallengesAr' : 'adamB2QuickChallenges';
            const knowledge = isArabic ? 'adamB2KnowledgeCheckExercisesAr' : 'adamB2KnowledgeCheckExercises';
            const vocabPairs = isArabic ? 'adamB2VocabularyChallengePairsAr' : 'adamB2VocabularyChallengePairs';
            const review = isArabic ? 'adamB2LanguageReviewExercisesAr' : 'adamB2LanguageReviewExercises';
            const finalChallenge = isArabic ? 'adamB2FinalChallengeExercisesAr' : 'adamB2FinalChallengeExercises';
            const focusMap = isArabic
              ? '{ ...adamB2LanguageFocusExercisesAr, ...adamB2LanguageFocusExercisesArPart2, ...adamB2LanguageFocusExercisesArPart3 }'
              : '{ ...adamB2LanguageFocusExercises, ...adamB2LanguageFocusExercisesPart2, ...adamB2LanguageFocusExercisesPart3 }';
            const exportName = isArabic ? 'adamB2PagesAr' : 'adamB2Pages';

            return `import type { Exercise, PageData } from '../../../../types';\n${exerciseImports}\n${focusImports}\n\nconst storyPages: PageData[] = ${json(stories)};\n\nconst languageFocus: Record<number, Exercise[]> = ${focusMap};\nfor (const page of storyPages) {\n  page.exercises = ${quick}[page.id] ? [${quick}[page.id]] : [];\n  if (languageFocus[page.id]) page.languageFocusExercises = languageFocus[page.id];\n}\n\nconst glossary = Array.from(new Map(storyPages.flatMap(page => page.vocabulary ?? []).map(item => [item.word.toLowerCase(), item] as const)).values());\n\nexport const ${exportName}: PageData[] = [\n  ...storyPages,\n  { ...${json(p18)}, exercises: ${knowledge} },\n  { ...${json(p19)}, exercises: ${review} },\n  { ...${json(p20)}, vocabularyPairs: ${vocabPairs} },\n  { ...${json(p21)}, vocabulary: glossary },\n  { ...${json(p22)}, exercises: ${finalChallenge} },\n];\n`;
          }

          fs.writeFileSync(path.join(root, 'src/data/adam/b2/en/pages.ts'), renderPages(false, englishPages));
          fs.writeFileSync(path.join(root, 'src/data/adam/b2/ar/pages.ts'), renderPages(true, arabicPages));

          const wrapper = `import type { BookData } from '../../../types';\nimport { adamB2Pages } from './en/pages';\nimport { adamB2PagesAr } from './ar/pages';\nimport { adamB2TeacherGuide, adamB2TeacherGuideMetadata } from './en/teacherGuide';\nimport { adamB2SelfStudyGuide, adamB2StudentGuideMetadata } from './en/selfStudyGuide';\nimport { adamB2TeacherGuideAr, adamB2TeacherGuideMetadataAr } from './ar/teacherGuide';\nimport { adamB2SelfStudyGuideAr, adamB2StudentGuideMetadataAr } from './ar/selfStudyGuide';\n\nexport const adamB2BookDataEn: BookData = {\n  id: 'b2-prophets-en',\n  title: 'Stories of the Prophets: Adam (B2)',\n  level: 'B2',\n  baseFontSize: 12,\n  pages: adamB2Pages,\n  teacherGuide: adamB2TeacherGuide,\n  teacherGuideMetadata: adamB2TeacherGuideMetadata,\n  selfStudyGuide: adamB2SelfStudyGuide,\n  studentGuideMetadata: adamB2StudentGuideMetadata,\n};\n\nexport const adamB2BookDataAr: BookData = {\n  id: 'b2-prophets-ar',\n  title: 'قصص الأنبياء: آدم (عليه السلام)',\n  level: 'B2',\n  baseFontSize: 14,\n  pages: adamB2PagesAr,\n  teacherGuide: adamB2TeacherGuideAr,\n  teacherGuideMetadata: adamB2TeacherGuideMetadataAr,\n  selfStudyGuide: adamB2SelfStudyGuideAr,\n  studentGuideMetadata: adamB2StudentGuideMetadataAr,\n};\n\nexport const adamB2BookData = adamB2BookDataEn;\n`;
          fs.writeFileSync(indexPath, wrapper);
          TS
          npx tsx /tmp/flatten-adam-b2.ts

      - name: Validate Adam B2 source structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          allowed = {'pages.ts','exercises.ts','selfStudyGuide.ts','teacherGuide.ts','languageFocus.ts','languageFocus2.ts','languageFocus3.ts'}
          for lang in ('en','ar'):
              d = Path('src/data/adam/b2') / lang
              names = {p.name for p in d.iterdir() if p.is_file() and p.suffix == '.ts'}
              extra = sorted(names - allowed)
              if extra:
                  raise SystemExit(f'{lang}: unexpected TypeScript files: {extra}')
              if 'pages.ts' not in names or 'exercises.ts' not in names or 'teacherGuide.ts' not in names or 'selfStudyGuide.ts' not in names:
                  raise SystemExit(f'{lang}: required source file missing')
          PY
          ! grep -R "picsum\|adam_b1\|animatedWords" src/data/adam/b2/en/pages.ts src/data/adam/b2/ar/pages.ts
          ! grep -E "STORY_IDS|standardize\(|QuickChallenges|LanguageFocusExercises|KnowledgeCheckExercises" src/data/adam/b2/index.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Remove temporary migration infrastructure and commit
        shell: bash
        run: |
          rm -f .github/workflows/temporary-b2-consolidation.yml
          rm -f .github/workflows/temporary-actions-smoke-test.yml
          rm -f scripts/consolidateB2StoryFiles.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/adam/b2/en/pages.ts src/data/adam/b2/ar/pages.ts src/data/adam/b2/index.ts
          git add -u .github/workflows scripts/consolidateB2StoryFiles.mjs
          git diff --cached --check
          git commit -m "Finalize Adam B2 source pages"
          git push origin HEAD:preview

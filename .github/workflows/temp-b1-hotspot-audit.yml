name: TEMP B1 Hotspot Source Audit

on:
  push:
    branches:
      - story-language-lock-rollout
    paths:
      - '.github/workflows/temp-b1-hotspot-audit.yml'
      - 'src/data/storyHotspotSourceLock.ts'
      - 'src/data/**/b1/**'
      - 'scripts/validation/tempB1HotspotSourceAudit.ts'
      - 'scripts/validation/validateStoryLanguageLock.ts'
      - 'docs/STORY_LANGUAGE_LOCK.md'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Audit B1 hotspot source lock
        run: npx tsx scripts/validation/tempB1HotspotSourceAudit.ts
      - name: Check B1 hotspot errors in main Story Language Lock
        run: |
          set +e
          npm run validate:story-language-lock > /tmp/story-language-lock.log 2>&1
          RC=$?
          set -e
          cat /tmp/story-language-lock.log
          B1_HOTSPOT_ERRORS=$(grep -Ec '^ERROR: .*:B1:.*hotspot ' /tmp/story-language-lock.log || true)
          BLOCKING=$(grep -Eo '[0-9]+ blocking error\(s\)\.' /tmp/story-language-lock.log | tail -1 || true)
          echo "validator_rc=$RC"
          echo "overall=$BLOCKING"
          echo "b1_hotspot_errors=$B1_HOTSPOT_ERRORS"
          test "$B1_HOTSPOT_ERRORS" = "0"

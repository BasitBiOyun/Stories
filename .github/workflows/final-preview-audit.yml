name: Final Preview Audit

on:
  push:
    branches: [ui-phosphor-responsive-final]

permissions:
  contents: read

concurrency:
  group: final-preview-audit
  cancel-in-progress: true

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Full repository quality gate
        run: npm run quality

      - name: Verify Lucide is fully removed from application source
        run: |
          if grep -R -n -E "from ['\"]lucide-react['\"]" src; then
            echo "Direct lucide-react import remains in src."
            exit 1
          fi
          if grep -q '"lucide-react"' package.json; then
            echo "lucide-react remains in package.json."
            exit 1
          fi
          echo "Phosphor semantic icon registry is the only application icon source."

      - name: Install lightweight browser audit dependency
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Start local application
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/stories-final-audit.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/stories-final-audit.log
          exit 1

      - name: Responsive reader, exercise, guide and RTL audit
        run: node scripts/validation/responsivePreviewAudit.mjs

      - name: Show app log on failure
        if: failure()
        run: cat /tmp/stories-final-audit.log || true

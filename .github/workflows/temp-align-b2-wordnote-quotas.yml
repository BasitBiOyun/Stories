name: TEMP Align B2 Word Notes Quotas

on:
  push:
    branches: [integration-work]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete lower quotas for chapter Word Notes
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          files = [
              'scripts/validation/validateMosesB2GoldPilot.ts',
              'scripts/validation/validateMosesB2GoldArabic.ts',
              'scripts/validation/validateAdamB2Gold.ts',
              'scripts/validation/validateAdamB2GoldArabic.ts',
              'scripts/validation/validateAbrahamB2Gold.ts',
              'scripts/validation/validateAbrahamB2GoldArabic.ts',
              'scripts/validation/validateMeccaB2Gold.ts',
              'scripts/validation/validateMeccaB2GoldArabic.ts',
              'scripts/validation/validateYunusB2Gold.ts',
          ]

          total = 0
          for name in files:
              p = Path(name)
              s = p.read_text()
              # Only chapter Word Notes use the local variable `vocabulary`.
              s2, n = re.subn(
                  r'vocabulary\.length >= \d+ && vocabulary\.length <= (\d+)',
                  r'vocabulary.length <= \1',
                  s,
              )
              if n:
                  s2 = re.sub(
                      r'Word Notes must contain \d+[–-](\d+) reviewed items\.',
                      r'Word Notes may contain up to \1 reviewed source-grounded items.',
                      s2,
                  )
                  p.write_text(s2)
                  total += n
                  print(f'{name}: {n} quota check(s) updated')

          if total == 0:
              raise SystemExit('no B2 chapter Word Notes quota found')
          print('total quota checks updated:', total)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validation/validate*B2*.ts
          git commit -m "remove obsolete B2 Word Notes lower quotas"
          git push origin HEAD:integration-work

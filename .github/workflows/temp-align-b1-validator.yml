name: TEMP Align B1 Validator

on:
  push:
    branches: [integration-work]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align B1 validator with final language lock
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/validation/validateB1Rollout.ts')
          s = p.read_text()
          imp = "import type { B1GoldPageConfig } from '../../src/data/b1GoldFactory';"
          s = s.replace(imp, imp + "\nimport { highlightPhraseOccurs } from '../../src/lib/highlightTextMatch';")
          s = s.replace("  'title',\n  'subtitle',\n  'content',", "  'subtitle',")
          s = s.replace("  'animatedWords',\n", "")
          anchor = "const validateCase = ({ label, canonical, book, config, minWordNotes = 3 }: Case) => {\n"
          repl = anchor + "  const language: 'en' | 'ar' = label.endsWith(' AR') ? 'ar' : 'en';\n  const stripApprovedBold = (value: string) => value.replaceAll('**', '');\n"
          if anchor not in s: raise SystemExit('B1 validateCase anchor missing')
          s = s.replace(anchor, repl)
          needle = """    for (const field of protectedStoryFields) {\n      assert.deepEqual(final[field], source[field], `${label} chapter ${id}: protected field ${field} changed.`);\n    }\n"""
          insertion = needle + """    assert.equal(final.title, stripApprovedBold(source.title), `${label} chapter ${id}: title changed beyond approved formatting cleanup.`);\n    assert.equal(final.content, stripApprovedBold(source.content), `${label} chapter ${id}: canonical prose changed beyond approved formatting cleanup.`);\n"""
          if needle not in s: raise SystemExit('B1 protected block missing')
          s = s.replace(needle, insertion)
          vneedle = """    vocabulary.forEach((entry) => {\n      assert.ok(entry.word.trim(), `${label} chapter ${id}: empty vocabulary word.`);\n      assert.ok(entry.definition.trim(), `${label} chapter ${id}: empty vocabulary definition.`);\n    });\n"""
          vinsert = vneedle + """    vocabulary.forEach((entry) => {\n      assert.ok(highlightPhraseOccurs(final.content, entry.word, language), `${label} chapter ${id}: vocabulary ${entry.word} is not grounded in the chapter.`);\n    });\n    final.animatedWords?.forEach((word) => {\n      assert.ok(highlightPhraseOccurs(final.content, word, language), `${label} chapter ${id}: animated highlight ${word} is not grounded in the chapter.`);\n    });\n"""
          if vneedle not in s: raise SystemExit('B1 vocab block missing')
          s = s.replace(vneedle, vinsert)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validation/validateB1Rollout.ts
          git commit -m "align B1 rollout validator with final language lock"
          git push origin HEAD:integration-work

name: TEMP Canonical Refresh

on:
  push:
    branches: [story-language-lock-rollout]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate baseline from current approved locked books
        run: npm run canonical:generate
      - name: Commit refreshed baseline once
        run: |
          rm -f .canonical-refresh-once
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validation/canonical-baseline.json .canonical-refresh-once
          git commit -m "refresh canonical baseline for current locked stories"
          git push origin HEAD:story-language-lock-rollout

name: TEMP Story Language Final Audit

on:
  push:
    branches:
      - story-language-lock-rollout
    paths:
      - '.github/workflows/temp-story-language-final-audit.yml'
      - 'src/data/**'
      - 'src/lib/highlightTextMatch.ts'
      - 'scripts/validation/validateStoryLanguageLock.ts'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Story Language Lock
        run: npm run validate:story-language-lock

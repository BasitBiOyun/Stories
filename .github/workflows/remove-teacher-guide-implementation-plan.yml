name: Remove Teacher Guide Implementation Plan

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Remove Teacher Guide implementation plan tab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove Implementation Plan tab and renumber Teacher Guide sections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/layout/TeacherGuide.tsx')
          text = path.read_text(encoding='utf-8')

          plan_line = "    { id: 'plans', label: `${formatNumber(4)}. ${t('tg.plans')}`, icon: <ClipboardList size={24} /> },\n"
          if plan_line not in text:
              raise SystemExit('Implementation Plan tab line not found; refusing unsafe edit.')
          text = text.replace(plan_line, '', 1)

          replacements = [
              ("{ id: 'framework', label: `${formatNumber(5)}.", "{ id: 'framework', label: `${formatNumber(4)}."),
              ("{ id: 'chapters', label: `${formatNumber(6)}.", "{ id: 'chapters', label: `${formatNumber(5)}."),
              ("{ id: 'management', label: `${formatNumber(7)}.", "{ id: 'management', label: `${formatNumber(6)}."),
              ("{ id: 'differentiation', label: `${formatNumber(8)}.", "{ id: 'differentiation', label: `${formatNumber(7)}."),
              ("{ id: 'assessment', label: `${formatNumber(9)}.", "{ id: 'assessment', label: `${formatNumber(8)}."),
              ("{ id: 'kinesthetic', label: `${formatNumber(10)}.", "{ id: 'kinesthetic', label: `${formatNumber(9)}."),
              ("{ id: 'global', label: `${formatNumber(11)}.", "{ id: 'global', label: `${formatNumber(10)}."),
              ("{ id: 'values', label: `${formatNumber(12)}.", "{ id: 'values', label: `${formatNumber(11)}."),
              ("{ id: 'sensitive', label: `${formatNumber(13)}.", "{ id: 'sensitive', label: `${formatNumber(12)}."),
              ("{ id: 'tips', label: `${formatNumber(14)}.", "{ id: 'tips', label: `${formatNumber(13)}."),
              ("{ id: 'home', label: `${formatNumber(15)}.", "{ id: 'home', label: `${formatNumber(14)}."),
              ("{ id: 'checklist', label: `${formatNumber(16)}.", "{ id: 'checklist', label: `${formatNumber(15)}."),
              ("{ id: 'appendices', label: `${formatNumber(17)}.", "{ id: 'appendices', label: `${formatNumber(16)}."),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected tab label not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/layout/TeacherGuide.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove Teacher Guide implementation plan tab"
          git push origin main

name: TEMP Integration Audit

on:
  push:
    branches: [integration-work]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full validation
        run: npm run validate
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Runtime fallback guard
        run: |
          test "$(grep -c "return t('nav.keyWordFallback');" src/components/book/StoryPage.tsx || true)" -eq 0
          test "$(grep -c "return '';" src/components/book/StoryPage.tsx || true)" -ge 2

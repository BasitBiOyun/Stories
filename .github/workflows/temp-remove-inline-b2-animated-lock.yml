name: TEMP Remove Inline B2 Animated Lock

on:
  push:
    branches: [integration-work]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove all legacy animatedWords protected-field entries
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'scripts/validation/validateMosesB2GoldPilot.ts',
              'scripts/validation/validateMosesB2GoldArabic.ts',
              'scripts/validation/validateAdamB2Gold.ts',
              'scripts/validation/validateAdamB2GoldArabic.ts',
              'scripts/validation/validateAbrahamB2Gold.ts',
              'scripts/validation/validateAbrahamB2GoldArabic.ts',
              'scripts/validation/validateMeccaB2Gold.ts',
              'scripts/validation/validateMeccaB2GoldArabic.ts',
              'scripts/validation/validateYunusB2Gold.ts',
          ]
          changed = []
          for name in files:
              p = Path(name)
              s = p.read_text()
              old = s
              s = s.replace("'animatedWords', ", '')
              s = s.replace("'animatedWords',", '')
              if s != old:
                  p.write_text(s)
                  changed.append(name)
          if not changed:
              raise SystemExit('no remaining animatedWords protected-field entry found')
          print('updated:', *changed, sep='\n- ')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validation/validate*B2*.ts
          git commit -m "remove inline B2 animatedWords protection"
          git push origin HEAD:integration-work

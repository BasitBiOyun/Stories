name: PDF Publication Pilot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/pdf-pilot/**'
      - 'docs/A2_PRINT_DESIGN_SYSTEM.md'
      - '.github/workflows/pdf-pilot.yml'
      - 'src/data/adam/a2/**'
      - 'src/data/fallbackVocab.ts'
      - 'public/Arakom-*.ttf'

permissions:
  contents: read

concurrency:
  group: pdf-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a2-golden-chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Build canonical-data-backed A2 chapter sample HTML
        run: npx tsx scripts/pdf-pilot/buildA2GoldenChapter.ts
      - name: Install pinned Vivliostyle CLI
        run: npm install --no-save --package-lock=false @vivliostyle/cli@11.1.0
      - name: Build English chapters 1 and 2
        run: npx vivliostyle build artifacts/a2-golden-chapter/adam-a2-en-golden.html --size A4 --output artifacts/a2-golden-chapter/adam-a2-en-ch1-ch2.pdf
      - name: Build Arabic chapters 1 and 2
        run: npx vivliostyle build artifacts/a2-golden-chapter/adam-a2-ar-golden.html --size A4 --output artifacts/a2-golden-chapter/adam-a2-ar-ch1-ch2.pdf
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Render all sample pages for visual inspection
        run: |
          mkdir -p artifacts/a2-golden-chapter/rendered/en artifacts/a2-golden-chapter/rendered/ar
          pdftoppm -png -r 150 artifacts/a2-golden-chapter/adam-a2-en-ch1-ch2.pdf artifacts/a2-golden-chapter/rendered/en/page
          pdftoppm -png -r 150 artifacts/a2-golden-chapter/adam-a2-ar-ch1-ch2.pdf artifacts/a2-golden-chapter/rendered/ar/page
      - name: Verify A2 pagination contract
        run: |
          EN_PAGES=$(pdfinfo artifacts/a2-golden-chapter/adam-a2-en-ch1-ch2.pdf | awk '/^Pages:/ {print $2}')
          AR_PAGES=$(pdfinfo artifacts/a2-golden-chapter/adam-a2-ar-ch1-ch2.pdf | awk '/^Pages:/ {print $2}')
          EN_RENDERS=$(find artifacts/a2-golden-chapter/rendered/en -name '*.png' | wc -l)
          AR_RENDERS=$(find artifacts/a2-golden-chapter/rendered/ar -name '*.png' | wc -l)
          echo "English pages: $EN_PAGES" | tee artifacts/a2-golden-chapter/page-counts.txt
          echo "Arabic pages: $AR_PAGES" | tee -a artifacts/a2-golden-chapter/page-counts.txt
          test "$EN_PAGES" -ge 2
          test "$AR_PAGES" -ge 2
          test "$EN_PAGES" -le 5
          test "$AR_PAGES" -le 6
          test "$EN_RENDERS" = "$EN_PAGES"
          test "$AR_RENDERS" = "$AR_PAGES"
      - name: Upload A2 chapter PDFs and renders
        uses: actions/upload-artifact@v4
        with:
          name: adam-a2-ch1-ch2-vivliostyle
          path: |
            artifacts/a2-golden-chapter/adam-a2-en-ch1-ch2.pdf
            artifacts/a2-golden-chapter/adam-a2-ar-ch1-ch2.pdf
            artifacts/a2-golden-chapter/rendered/**/*.png
            artifacts/a2-golden-chapter/README.txt
            artifacts/a2-golden-chapter/page-counts.txt
          retention-days: 14
          if-no-files-found: error

  a2-story-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - ids: '3,4'
            slug: 'ch3-ch4'
            output: 'artifacts/a2-chapter-3-4'
          - ids: '5,6'
            slug: 'ch5-ch6'
            output: 'artifacts/a2-chapter-5-6'
          - ids: '7,8'
            slug: 'ch7-ch8'
            output: 'artifacts/a2-chapter-7-8'
          - ids: '9,10'
            slug: 'ch9-ch10'
            output: 'artifacts/a2-chapter-9-10'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Build Adam A2 chapter pair HTML
        env:
          A2_CHAPTER_IDS: ${{ matrix.ids }}
          A2_OUTPUT_DIR: ${{ matrix.output }}
        run: npx tsx scripts/pdf-pilot/buildA2ChapterSample.ts
      - name: Install pinned Vivliostyle CLI
        run: npm install --no-save --package-lock=false @vivliostyle/cli@11.1.0
      - name: Build English chapter pair
        run: npx vivliostyle build ${{ matrix.output }}/adam-a2-en.html --size A4 --output ${{ matrix.output }}/adam-a2-en-${{ matrix.slug }}.pdf
      - name: Build Arabic chapter pair
        run: npx vivliostyle build ${{ matrix.output }}/adam-a2-ar.html --size A4 --output ${{ matrix.output }}/adam-a2-ar-${{ matrix.slug }}.pdf
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Render chapter pair
        run: |
          mkdir -p ${{ matrix.output }}/rendered/en ${{ matrix.output }}/rendered/ar
          pdftoppm -png -r 150 ${{ matrix.output }}/adam-a2-en-${{ matrix.slug }}.pdf ${{ matrix.output }}/rendered/en/page
          pdftoppm -png -r 150 ${{ matrix.output }}/adam-a2-ar-${{ matrix.slug }}.pdf ${{ matrix.output }}/rendered/ar/page
      - name: Verify chapter pair pagination
        run: |
          EN_PAGES=$(pdfinfo ${{ matrix.output }}/adam-a2-en-${{ matrix.slug }}.pdf | awk '/^Pages:/ {print $2}')
          AR_PAGES=$(pdfinfo ${{ matrix.output }}/adam-a2-ar-${{ matrix.slug }}.pdf | awk '/^Pages:/ {print $2}')
          EN_RENDERS=$(find ${{ matrix.output }}/rendered/en -name '*.png' | wc -l)
          AR_RENDERS=$(find ${{ matrix.output }}/rendered/ar -name '*.png' | wc -l)
          echo "English pages: $EN_PAGES" | tee ${{ matrix.output }}/page-counts.txt
          echo "Arabic pages: $AR_PAGES" | tee -a ${{ matrix.output }}/page-counts.txt
          test "$EN_PAGES" -ge 2
          test "$AR_PAGES" -ge 2
          test "$EN_PAGES" -le 4
          test "$AR_PAGES" -le 4
          test "$EN_RENDERS" = "$EN_PAGES"
          test "$AR_RENDERS" = "$AR_PAGES"
      - name: Upload chapter pair PDFs and renders
        uses: actions/upload-artifact@v4
        with:
          name: adam-a2-${{ matrix.slug }}-vivliostyle
          path: |
            ${{ matrix.output }}/adam-a2-en-${{ matrix.slug }}.pdf
            ${{ matrix.output }}/adam-a2-ar-${{ matrix.slug }}.pdf
            ${{ matrix.output }}/rendered/**/*.png
            ${{ matrix.output }}/README.txt
            ${{ matrix.output }}/page-counts.txt
          retention-days: 14
          if-no-files-found: error

  a2-review-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Build Adam A2 pages 11 and 12 HTML
        run: npx tsx scripts/pdf-pilot/buildA2ReviewPages.ts
      - name: Install pinned Vivliostyle CLI
        run: npm install --no-save --package-lock=false @vivliostyle/cli@11.1.0
      - name: Build English review pages
        run: npx vivliostyle build artifacts/a2-review-pages/adam-a2-en-review.html --size A4 --output artifacts/a2-review-pages/adam-a2-en-pages11-12.pdf
      - name: Build Arabic review pages
        run: npx vivliostyle build artifacts/a2-review-pages/adam-a2-ar-review.html --size A4 --output artifacts/a2-review-pages/adam-a2-ar-pages11-12.pdf
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Render review pages
        run: |
          mkdir -p artifacts/a2-review-pages/rendered/en artifacts/a2-review-pages/rendered/ar
          pdftoppm -png -r 150 artifacts/a2-review-pages/adam-a2-en-pages11-12.pdf artifacts/a2-review-pages/rendered/en/page
          pdftoppm -png -r 150 artifacts/a2-review-pages/adam-a2-ar-pages11-12.pdf artifacts/a2-review-pages/rendered/ar/page
      - name: Verify review page pagination
        run: |
          EN_PAGES=$(pdfinfo artifacts/a2-review-pages/adam-a2-en-pages11-12.pdf | awk '/^Pages:/ {print $2}')
          AR_PAGES=$(pdfinfo artifacts/a2-review-pages/adam-a2-ar-pages11-12.pdf | awk '/^Pages:/ {print $2}')
          test "$EN_PAGES" = "2"
          test "$AR_PAGES" = "2"
          test "$(find artifacts/a2-review-pages/rendered/en -name '*.png' | wc -l)" = "2"
          test "$(find artifacts/a2-review-pages/rendered/ar -name '*.png' | wc -l)" = "2"
          echo "English pages: $EN_PAGES" | tee artifacts/a2-review-pages/page-counts.txt
          echo "Arabic pages: $AR_PAGES" | tee -a artifacts/a2-review-pages/page-counts.txt
      - name: Upload review PDFs and renders
        uses: actions/upload-artifact@v4
        with:
          name: adam-a2-pages11-12-vivliostyle
          path: |
            artifacts/a2-review-pages/adam-a2-en-pages11-12.pdf
            artifacts/a2-review-pages/adam-a2-ar-pages11-12.pdf
            artifacts/a2-review-pages/rendered/**/*.png
            artifacts/a2-review-pages/README.txt
            artifacts/a2-review-pages/page-counts.txt
          retention-days: 14
          if-no-files-found: error

  a2-final-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Final Review HTML
        run: npx tsx scripts/pdf-pilot/buildA2FinalReview.ts
      - name: Install Vivliostyle
        run: npm install --no-save --package-lock=false @vivliostyle/cli@11.1.0
      - name: Build English Final Review
        run: npx vivliostyle build artifacts/a2-final-review/adam-a2-en-final-review.html --size A4 --output artifacts/a2-final-review/adam-a2-en-final-review.pdf
      - name: Build Arabic Final Review
        run: npx vivliostyle build artifacts/a2-final-review/adam-a2-ar-final-review.html --size A4 --output artifacts/a2-final-review/adam-a2-ar-final-review.pdf
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Render and verify Final Review
        run: |
          mkdir -p artifacts/a2-final-review/rendered/en artifacts/a2-final-review/rendered/ar
          pdftoppm -png -r 150 artifacts/a2-final-review/adam-a2-en-final-review.pdf artifacts/a2-final-review/rendered/en/page
          pdftoppm -png -r 150 artifacts/a2-final-review/adam-a2-ar-final-review.pdf artifacts/a2-final-review/rendered/ar/page
          EN=$(pdfinfo artifacts/a2-final-review/adam-a2-en-final-review.pdf | awk '/^Pages:/ {print $2}')
          AR=$(pdfinfo artifacts/a2-final-review/adam-a2-ar-final-review.pdf | awk '/^Pages:/ {print $2}')
          echo "English pages: $EN" | tee artifacts/a2-final-review/page-counts.txt
          echo "Arabic pages: $AR" | tee -a artifacts/a2-final-review/page-counts.txt
          test "$EN" = "4"
          test "$AR" = "4"
      - uses: actions/upload-artifact@v4
        with:
          name: adam-a2-final-review-vivliostyle
          path: |
            artifacts/a2-final-review/*.pdf
            artifacts/a2-final-review/rendered/**/*.png
            artifacts/a2-final-review/README.txt
            artifacts/a2-final-review/page-counts.txt
          retention-days: 14
          if-no-files-found: error

  a2-glossary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build glossary HTML
        run: npx tsx scripts/pdf-pilot/buildA2Glossary.ts
      - name: Install Vivliostyle
        run: npm install --no-save --package-lock=false @vivliostyle/cli@11.1.0
      - name: Build English glossary
        run: npx vivliostyle build artifacts/a2-glossary/adam-a2-en-glossary.html --size A4 --output artifacts/a2-glossary/adam-a2-en-glossary.pdf
      - name: Build Arabic glossary
        run: npx vivliostyle build artifacts/a2-glossary/adam-a2-ar-glossary.html --size A4 --output artifacts/a2-glossary/adam-a2-ar-glossary.pdf
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Render and verify glossary
        run: |
          mkdir -p artifacts/a2-glossary/rendered/en artifacts/a2-glossary/rendered/ar
          pdftoppm -png -r 150 artifacts/a2-glossary/adam-a2-en-glossary.pdf artifacts/a2-glossary/rendered/en/page
          pdftoppm -png -r 150 artifacts/a2-glossary/adam-a2-ar-glossary.pdf artifacts/a2-glossary/rendered/ar/page
          EN=$(pdfinfo artifacts/a2-glossary/adam-a2-en-glossary.pdf | awk '/^Pages:/ {print $2}')
          AR=$(pdfinfo artifacts/a2-glossary/adam-a2-ar-glossary.pdf | awk '/^Pages:/ {print $2}')
          echo "English pages: $EN" | tee artifacts/a2-glossary/page-counts.txt
          echo "Arabic pages: $AR" | tee -a artifacts/a2-glossary/page-counts.txt
          test "$EN" = "2"
          test "$AR" = "2"
      - uses: actions/upload-artifact@v4
        with:
          name: adam-a2-glossary-vivliostyle
          path: |
            artifacts/a2-glossary/*.pdf
            artifacts/a2-glossary/rendered/**/*.png
            artifacts/a2-glossary/README.txt
            artifacts/a2-glossary/page-counts.txt
          retention-days: 14
          if-no-files-found: error

  a2-final-challenge-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Final Challenge opener HTML
        run: npx tsx scripts/pdf-pilot/buildA2FinalChallengeShell.ts
      - name: Install Vivliostyle
        run: npm install --no-save --package-lock=false @vivliostyle/cli@11.1.0
      - name: Build English Final Challenge opener
        run: npx vivliostyle build artifacts/a2-final-challenge-shell/adam-a2-en-final-challenge.html --size A4 --output artifacts/a2-final-challenge-shell/adam-a2-en-final-challenge-opener.pdf
      - name: Build Arabic Final Challenge opener
        run: npx vivliostyle build artifacts/a2-final-challenge-shell/adam-a2-ar-final-challenge.html --size A4 --output artifacts/a2-final-challenge-shell/adam-a2-ar-final-challenge-opener.pdf
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Render and verify opener
        run: |
          mkdir -p artifacts/a2-final-challenge-shell/rendered/en artifacts/a2-final-challenge-shell/rendered/ar
          pdftoppm -png -r 150 artifacts/a2-final-challenge-shell/adam-a2-en-final-challenge-opener.pdf artifacts/a2-final-challenge-shell/rendered/en/page
          pdftoppm -png -r 150 artifacts/a2-final-challenge-shell/adam-a2-ar-final-challenge-opener.pdf artifacts/a2-final-challenge-shell/rendered/ar/page
          test "$(pdfinfo artifacts/a2-final-challenge-shell/adam-a2-en-final-challenge-opener.pdf | awk '/^Pages:/ {print $2}')" = "1"
          test "$(pdfinfo artifacts/a2-final-challenge-shell/adam-a2-ar-final-challenge-opener.pdf | awk '/^Pages:/ {print $2}')" = "1"
      - uses: actions/upload-artifact@v4
        with:
          name: adam-a2-final-challenge-opener-vivliostyle
          path: |
            artifacts/a2-final-challenge-shell/*.pdf
            artifacts/a2-final-challenge-shell/rendered/**/*.png
            artifacts/a2-final-challenge-shell/README.txt
          retention-days: 14
          if-no-files-found: error

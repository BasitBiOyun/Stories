name: PDF Publication Pilot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/pdf-pilot/**'
      - 'docs/A2_PRINT_DESIGN_SYSTEM.md'
      - '.github/workflows/pdf-pilot.yml'
      - 'src/data/adam/a2/**'
      - 'public/Arakom-*.ttf'

permissions:
  contents: read

concurrency:
  group: pdf-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a2-golden-chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build canonical-data-backed A2 golden HTML
        run: npx tsx scripts/pdf-pilot/buildA2GoldenChapter.ts

      - name: Install pinned Vivliostyle CLI
        run: npm install --no-save --package-lock=false @vivliostyle/cli@11.1.0

      - name: Build English golden page
        run: npx vivliostyle build artifacts/a2-golden-chapter/adam-a2-en-golden.html --size A4 --output artifacts/a2-golden-chapter/adam-a2-en-golden.pdf

      - name: Build Arabic golden page
        run: npx vivliostyle build artifacts/a2-golden-chapter/adam-a2-ar-golden.html --size A4 --output artifacts/a2-golden-chapter/adam-a2-ar-golden.pdf

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Render golden pages for visual inspection
        run: |
          mkdir -p artifacts/a2-golden-chapter/rendered/en artifacts/a2-golden-chapter/rendered/ar
          pdftoppm -png -r 150 -singlefile artifacts/a2-golden-chapter/adam-a2-en-golden.pdf artifacts/a2-golden-chapter/rendered/en/chapter-2
          pdftoppm -png -r 150 -singlefile artifacts/a2-golden-chapter/adam-a2-ar-golden.pdf artifacts/a2-golden-chapter/rendered/ar/chapter-2

      - name: Verify one-page A2 golden contract
        run: |
          EN_PAGES=$(pdfinfo artifacts/a2-golden-chapter/adam-a2-en-golden.pdf | awk '/^Pages:/ {print $2}')
          AR_PAGES=$(pdfinfo artifacts/a2-golden-chapter/adam-a2-ar-golden.pdf | awk '/^Pages:/ {print $2}')
          echo "English pages: $EN_PAGES"
          echo "Arabic pages: $AR_PAGES"
          test "$EN_PAGES" = "1"
          test "$AR_PAGES" = "1"
          test -f artifacts/a2-golden-chapter/rendered/en/chapter-2.png
          test -f artifacts/a2-golden-chapter/rendered/ar/chapter-2.png

      - name: Upload A2 golden PDFs and renders
        uses: actions/upload-artifact@v4
        with:
          name: adam-a2-golden-chapter
          path: |
            artifacts/a2-golden-chapter/adam-a2-en-golden.pdf
            artifacts/a2-golden-chapter/adam-a2-ar-golden.pdf
            artifacts/a2-golden-chapter/rendered/**/*.png
            artifacts/a2-golden-chapter/README.txt
          retention-days: 14
          if-no-files-found: error

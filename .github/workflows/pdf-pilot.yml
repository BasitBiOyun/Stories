name: PDF Publication Pilot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/pdf-pilot/**'
      - '.github/workflows/pdf-pilot.yml'
      - 'src/data/adam/a2/**'
      - 'public/Arakom-*.ttf'

permissions:
  contents: read

concurrency:
  group: pdf-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adam-a2-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build canonical-data-backed expanded pilot HTML
        run: npx tsx scripts/pdf-pilot/buildAdamA2PilotV2.ts

      - name: Install pinned Vivliostyle CLI
        run: npm install --no-save --package-lock=false @vivliostyle/cli@11.1.0

      - name: Build English pilot PDF
        run: npx vivliostyle build artifacts/pdf-pilot-v2/adam-a2-en-pilot-v2.html --size A4 --output artifacts/pdf-pilot-v2/adam-a2-en-vivliostyle-v2.pdf

      - name: Build Arabic pilot PDF
        run: npx vivliostyle build artifacts/pdf-pilot-v2/adam-a2-ar-pilot-v2.html --size A4 --output artifacts/pdf-pilot-v2/adam-a2-ar-vivliostyle-v2.pdf

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Render all pages for visual inspection
        run: |
          mkdir -p artifacts/pdf-pilot-v2/rendered/en artifacts/pdf-pilot-v2/rendered/ar
          pdftoppm -png -r 135 artifacts/pdf-pilot-v2/adam-a2-en-vivliostyle-v2.pdf artifacts/pdf-pilot-v2/rendered/en/page
          pdftoppm -png -r 135 artifacts/pdf-pilot-v2/adam-a2-ar-vivliostyle-v2.pdf artifacts/pdf-pilot-v2/rendered/ar/page

      - name: Record and verify page counts
        run: |
          EN_PAGES=$(pdfinfo artifacts/pdf-pilot-v2/adam-a2-en-vivliostyle-v2.pdf | awk '/^Pages:/ {print $2}')
          AR_PAGES=$(pdfinfo artifacts/pdf-pilot-v2/adam-a2-ar-vivliostyle-v2.pdf | awk '/^Pages:/ {print $2}')
          EN_RENDERS=$(find artifacts/pdf-pilot-v2/rendered/en -name '*.png' | wc -l)
          AR_RENDERS=$(find artifacts/pdf-pilot-v2/rendered/ar -name '*.png' | wc -l)
          echo "English pages: $EN_PAGES" | tee artifacts/pdf-pilot-v2/page-counts.txt
          echo "Arabic pages: $AR_PAGES" | tee -a artifacts/pdf-pilot-v2/page-counts.txt
          test "$EN_PAGES" -ge 9
          test "$AR_PAGES" -ge 9
          test "$EN_PAGES" -le 12
          test "$AR_PAGES" -le 12
          test "$EN_RENDERS" = "$EN_PAGES"
          test "$AR_RENDERS" = "$AR_PAGES"

      - name: Upload expanded pilot PDFs and page renders
        uses: actions/upload-artifact@v4
        with:
          name: adam-a2-vivliostyle-pilot-v2
          path: |
            artifacts/pdf-pilot-v2/adam-a2-en-vivliostyle-v2.pdf
            artifacts/pdf-pilot-v2/adam-a2-ar-vivliostyle-v2.pdf
            artifacts/pdf-pilot-v2/rendered/**/*.png
            artifacts/pdf-pilot-v2/README.txt
            artifacts/pdf-pilot-v2/page-counts.txt
          retention-days: 14
          if-no-files-found: error

name: PDF Publication Pilot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/pdf-pilot/**'
      - 'docs/A2_PRINT_DESIGN_SYSTEM.md'
      - '.github/workflows/pdf-pilot.yml'
      - 'src/data/adam/a2/**'
      - 'src/data/fallbackVocab.ts'
      - 'public/Arakom-*.ttf'

permissions:
  contents: read

concurrency:
  group: pdf-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a2-golden-chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build canonical-data-backed A2 chapter sample HTML
        run: npx tsx scripts/pdf-pilot/buildA2GoldenChapter.ts

      - name: Install pinned Vivliostyle CLI
        run: npm install --no-save --package-lock=false @vivliostyle/cli@11.1.0

      - name: Build English chapters 1 and 2
        run: npx vivliostyle build artifacts/a2-golden-chapter/adam-a2-en-golden.html --size A4 --output artifacts/a2-golden-chapter/adam-a2-en-ch1-ch2.pdf

      - name: Build Arabic chapters 1 and 2
        run: npx vivliostyle build artifacts/a2-golden-chapter/adam-a2-ar-golden.html --size A4 --output artifacts/a2-golden-chapter/adam-a2-ar-ch1-ch2.pdf

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Render all sample pages for visual inspection
        run: |
          mkdir -p artifacts/a2-golden-chapter/rendered/en artifacts/a2-golden-chapter/rendered/ar
          pdftoppm -png -r 150 artifacts/a2-golden-chapter/adam-a2-en-ch1-ch2.pdf artifacts/a2-golden-chapter/rendered/en/page
          pdftoppm -png -r 150 artifacts/a2-golden-chapter/adam-a2-ar-ch1-ch2.pdf artifacts/a2-golden-chapter/rendered/ar/page

      - name: Verify A2 pagination contract
        run: |
          EN_PAGES=$(pdfinfo artifacts/a2-golden-chapter/adam-a2-en-ch1-ch2.pdf | awk '/^Pages:/ {print $2}')
          AR_PAGES=$(pdfinfo artifacts/a2-golden-chapter/adam-a2-ar-ch1-ch2.pdf | awk '/^Pages:/ {print $2}')
          EN_RENDERS=$(find artifacts/a2-golden-chapter/rendered/en -name '*.png' | wc -l)
          AR_RENDERS=$(find artifacts/a2-golden-chapter/rendered/ar -name '*.png' | wc -l)
          echo "English pages: $EN_PAGES" | tee artifacts/a2-golden-chapter/page-counts.txt
          echo "Arabic pages: $AR_PAGES" | tee -a artifacts/a2-golden-chapter/page-counts.txt
          test "$EN_PAGES" -ge 2
          test "$AR_PAGES" -ge 2
          test "$EN_PAGES" -le 5
          test "$AR_PAGES" -le 6
          test "$EN_RENDERS" = "$EN_PAGES"
          test "$AR_RENDERS" = "$AR_PAGES"

      - name: Upload A2 chapter PDFs and renders
        uses: actions/upload-artifact@v4
        with:
          name: adam-a2-ch1-ch2-vivliostyle
          path: |
            artifacts/a2-golden-chapter/adam-a2-en-ch1-ch2.pdf
            artifacts/a2-golden-chapter/adam-a2-ar-ch1-ch2.pdf
            artifacts/a2-golden-chapter/rendered/**/*.png
            artifacts/a2-golden-chapter/README.txt
            artifacts/a2-golden-chapter/page-counts.txt
          retention-days: 14
          if-no-files-found: error

  a2-story-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - ids: '3,4'
            label: '3 and 4'
            slug: 'ch3-ch4'
            output: 'artifacts/a2-chapter-3-4'
          - ids: '5,6'
            label: '5 and 6'
            slug: 'ch5-ch6'
            output: 'artifacts/a2-chapter-5-6'
          - ids: '7,8'
            label: '7 and 8'
            slug: 'ch7-ch8'
            output: 'artifacts/a2-chapter-7-8'
          - ids: '9,10'
            label: '9 and 10'
            slug: 'ch9-ch10'
            output: 'artifacts/a2-chapter-9-10'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build Adam A2 chapter pair HTML
        env:
          A2_CHAPTER_IDS: ${{ matrix.ids }}
          A2_OUTPUT_DIR: ${{ matrix.output }}
        run: npx tsx scripts/pdf-pilot/buildA2ChapterSample.ts

      - name: Install pinned Vivliostyle CLI
        run: npm install --no-save --package-lock=false @vivliostyle/cli@11.1.0

      - name: Build English chapter pair
        run: npx vivliostyle build ${{ matrix.output }}/adam-a2-en.html --size A4 --output ${{ matrix.output }}/adam-a2-en-${{ matrix.slug }}.pdf

      - name: Build Arabic chapter pair
        run: npx vivliostyle build ${{ matrix.output }}/adam-a2-ar.html --size A4 --output ${{ matrix.output }}/adam-a2-ar-${{ matrix.slug }}.pdf

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Render chapter pair
        run: |
          mkdir -p ${{ matrix.output }}/rendered/en ${{ matrix.output }}/rendered/ar
          pdftoppm -png -r 150 ${{ matrix.output }}/adam-a2-en-${{ matrix.slug }}.pdf ${{ matrix.output }}/rendered/en/page
          pdftoppm -png -r 150 ${{ matrix.output }}/adam-a2-ar-${{ matrix.slug }}.pdf ${{ matrix.output }}/rendered/ar/page

      - name: Verify chapter pair pagination
        run: |
          EN_PAGES=$(pdfinfo ${{ matrix.output }}/adam-a2-en-${{ matrix.slug }}.pdf | awk '/^Pages:/ {print $2}')
          AR_PAGES=$(pdfinfo ${{ matrix.output }}/adam-a2-ar-${{ matrix.slug }}.pdf | awk '/^Pages:/ {print $2}')
          EN_RENDERS=$(find ${{ matrix.output }}/rendered/en -name '*.png' | wc -l)
          AR_RENDERS=$(find ${{ matrix.output }}/rendered/ar -name '*.png' | wc -l)
          echo "English pages: $EN_PAGES" | tee ${{ matrix.output }}/page-counts.txt
          echo "Arabic pages: $AR_PAGES" | tee -a ${{ matrix.output }}/page-counts.txt
          test "$EN_PAGES" -ge 2
          test "$AR_PAGES" -ge 2
          test "$EN_PAGES" -le 4
          test "$AR_PAGES" -le 4
          test "$EN_RENDERS" = "$EN_PAGES"
          test "$AR_RENDERS" = "$AR_PAGES"

      - name: Upload chapter pair PDFs and renders
        uses: actions/upload-artifact@v4
        with:
          name: adam-a2-${{ matrix.slug }}-vivliostyle
          path: |
            ${{ matrix.output }}/adam-a2-en-${{ matrix.slug }}.pdf
            ${{ matrix.output }}/adam-a2-ar-${{ matrix.slug }}.pdf
            ${{ matrix.output }}/rendered/**/*.png
            ${{ matrix.output }}/README.txt
            ${{ matrix.output }}/page-counts.txt
          retention-days: 14
          if-no-files-found: error

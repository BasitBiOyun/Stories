name: TEMP A2 Hotspot Source Audit

on:
  push:
    branches:
      - story-language-lock-rollout
    paths:
      - '.github/workflows/temp-a2-hotspot-audit.yml'
      - 'src/data/a2HotspotSourceLock.ts'
      - 'src/data/**/a2/**'
      - 'scripts/validation/tempA2HotspotSourceAudit.ts'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Audit A2 hotspot source lock
        run: npx tsx scripts/validation/tempA2HotspotSourceAudit.ts

name: Minimal A2-B1-B2 Release Gate

on:
  pull_request:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: minimal-release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate A2 B1 B2 rollout
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install PDF smoke-test tools
        run: |
          npm install --no-save --package-lock=false @vivliostyle/cli@11.1.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Generate representative B1 and B2 EN/AR samples
        run: |
          B1_BOOK=moses B1_LANGUAGE=both B1_CHAPTER_IDS=1,13 npm run pdf:b1-sample
          B2_BOOK=moses B2_LANGUAGE=both B2_CHAPTER_IDS=1,24 npm run pdf:b2-sample

      - name: Render any HTML-only samples and verify PDF/PNG evidence
        shell: bash
        run: |
          mkdir -p artifacts/release-smoke/rendered
          if [ "$(find artifacts -type f -name '*.pdf' | wc -l)" -lt 4 ]; then
            while IFS= read -r html; do
              slug=$(echo "$html" | sed 's#^artifacts/##; s#[/ ]#-#g; s#\.html$##')
              npx vivliostyle build "$html" --size A4 --output "artifacts/release-smoke/${slug}.pdf"
            done < <(find artifacts -type f -name '*.html' -print)
          fi
          while IFS= read -r pdf; do
            slug=$(echo "$pdf" | sed 's#^artifacts/##; s#[/ ]#-#g; s#\.pdf$##')
            pdftoppm -png -r 120 "$pdf" "artifacts/release-smoke/rendered/${slug}"
          done < <(find artifacts -type f -name '*.pdf' -print)
          PDF_COUNT=$(find artifacts -type f -name '*.pdf' | wc -l)
          PNG_COUNT=$(find artifacts/release-smoke/rendered -type f -name '*.png' | wc -l)
          echo "PDF_COUNT=$PDF_COUNT"
          echo "PNG_COUNT=$PNG_COUNT"
          test "$PDF_COUNT" -ge 4
          test "$PNG_COUNT" -ge 4

      - name: Upload compact release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-b1-b2-release-gate-evidence
          path: |
            artifacts/**/*.pdf
            artifacts/release-smoke/rendered/**/*.png
          retention-days: 3
          if-no-files-found: warn

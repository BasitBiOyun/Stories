name: Learning System Preview Gate

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-system-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  learning-system:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate all registered books
        run: npm run validate:learning-system

      - name: Audit Firebase media coverage
        run: npm run audit:media

      - name: Run full content and guide validation
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

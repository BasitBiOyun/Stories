name: TEMP Responsive Baseline

on:
  push:
    branches: [ui-phosphor-responsive]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser audit dependency
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0; sleep 1; done
          cat /tmp/vite.log
          exit 1
      - name: Browser baseline
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const sizes=[[320,568],[360,800],[390,844],[430,932],[768,1024],[820,1180],[1024,768],[1280,800],[1440,900]];
          (async()=>{const browser=await chromium.launch({channel:'chrome',headless:true}); let failed=false;
            for(const [width,height] of sizes){
              const page=await browser.newPage({viewport:{width,height}});
              await page.goto('http://127.0.0.1:3000',{waitUntil:'networkidle'});
              const input=page.locator('input[placeholder="Access Code"]');
              if(await input.count()){await input.fill('stories_enar'); await page.locator('button[type="submit"]').click(); await page.waitForTimeout(500);}
              const m=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,bw:document.body.scrollWidth,iw:innerWidth}));
              const overflow=Math.max(m.sw,m.bw)-m.cw;
              console.log(`HOME ${width}x${height} overflow=${overflow} metrics=${JSON.stringify(m)}`);
              if(overflow>1) failed=true;
              await page.close();
            }
            await browser.close(); if(failed)process.exit(2);
          })();
          NODE

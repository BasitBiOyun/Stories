name: TEMP Align A2 Hotspot Validator

on:
  push:
    branches: [integration-work]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align hotspot source normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/validation/validateA2Rollout.ts')
          s = p.read_text()
          marker = "import { highlightPhraseOccurs } from '../../src/lib/highlightTextMatch';"
          if marker not in s:
              raise SystemExit('highlight matcher import missing')
          s = s.replace(marker, marker + "\nimport { normalizeHotspotSourceText } from '../../src/data/storyHotspotSourceLock';")
          old = """const sourceContains = (content: string, excerpt: string, language: 'en' | 'ar'): boolean =>\n  normalizeSource(content, language).includes(normalizeSource(excerpt, language));"""
          new = """const sourceContains = (content: string, excerpt: string, language: 'en' | 'ar'): boolean =>\n  normalizeHotspotSourceText(content, language).includes(normalizeHotspotSourceText(excerpt, language));"""
          if old not in s:
              raise SystemExit('sourceContains block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validation/validateA2Rollout.ts
          git commit -m "align A2 hotspot validator with source lock"
          git push origin HEAD:integration-work

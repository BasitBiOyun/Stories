name: TEMP Preview Health Check

on:
  push:
    branches: [integration-work]

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check preview root and PDF health
        run: |
          set -euo pipefail
          URL='https://stories-preview-603844754803.us-west1.run.app'
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -L -o /tmp/root.html -w '%{http_code}' --max-time 30 "$URL" || true)
            echo "root attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          test "$code" = "200"
          test -s /tmp/root.html
          health_code=$(curl -sS -L -o /tmp/health.json -w '%{http_code}' --max-time 30 "$URL/api/pdf/health" || true)
          echo "pdf health: HTTP $health_code"
          cat /tmp/health.json
          test "$health_code" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const count = body.count ?? body.publicationCount ?? body.total ?? body.ready;
          if (count !== 90 && !(body.healthy === true && JSON.stringify(body).includes('90'))) {
            console.error('Unexpected PDF health payload:', body);
            process.exit(1);
          }
          NODE

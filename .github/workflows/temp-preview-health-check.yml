name: TEMP Preview Health Check

on:
  push:
    branches: [integration-work]

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for validated preview bundle
        run: |
          set -euo pipefail
          URL='https://stories-preview-603844754803.us-west1.run.app'
          EXPECTED='/assets/index-Us8iLJw0.js'
          matched=0
          for attempt in $(seq 1 30); do
            code=$(curl -sS -L -o /tmp/root.html -w '%{http_code}' --max-time 30 "$URL" || true)
            script=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/root.html | head -1 || true)
            echo "attempt $attempt: HTTP $code script=$script"
            if [ "$code" = '200' ] && [ "$script" = "$EXPECTED" ]; then
              matched=1
              break
            fi
            sleep 10
          done
          test "$matched" -eq 1
          asset_code=$(curl -sS -L -o /tmp/app.js -w '%{http_code}' --max-time 30 "$URL$EXPECTED" || true)
          echo "validated asset: HTTP $asset_code size=$(wc -c </tmp/app.js)"
          test "$asset_code" = '200'
          test -s /tmp/app.js
          health_code=$(curl -sS -L -o /tmp/health.out -w '%{http_code}' --max-time 30 "$URL/api/pdf/health" || true)
          echo "pdf health endpoint: HTTP $health_code"
          head -c 500 /tmp/health.out || true
          echo

name: One-off Mecca A2 cleanup

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/oneoff-mecca-a2-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Mecca A2 cleanup
        run: node scripts/oneoff_mecca_a2_cleanup.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Remove one-off tooling
        run: |
          rm -f scripts/oneoff_mecca_a2_cleanup.mjs
          rm -f .github/workflows/oneoff-mecca-a2-cleanup.yml

      - name: Commit completed Mecca A2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/mecca/a2/en/pages.ts src/data/mecca/a2/ar/pages.ts src/data/mecca/a2/en/teacherGuide.ts src/data/mecca/a2/ar/teacherGuide.ts docs/BOOK_QA_PROGRESS.md
          git add -u -- src/data/mecca/a2 scripts/oneoff_mecca_a2_cleanup.mjs .github/workflows/oneoff-mecca-a2-cleanup.yml
          git commit -m 'Complete Mecca A2 manual QA'
          git push origin HEAD:preview

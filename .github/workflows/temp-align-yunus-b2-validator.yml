name: TEMP Align Yunus B2 Validator

on:
  push:
    branches: [integration-work]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Yunus hotspot/reference checks with final source lock
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/validation/validateYunusB2Gold.ts')
          s = p.read_text()

          imp = "import { yunusB2GoldContractAr } from '../../src/data/yunusEmre/b2/goldAr';"
          if imp not in s:
              raise SystemExit('Yunus validator import anchor missing')
          s = s.replace(imp, imp + "\nimport { normalizeHotspotSourceText } from '../../src/data/storyHotspotSourceLock';")

          old = """    for (const hotspot of fh) {\n      if (language === 'en') assert.ok(/^The chapter presents this in Yunus Emre/.test(hotspot.description), `${tag} ${hotspot.id}: attribution framing missing.`);\n      else assert.ok(/^يقدم الفصل هذه الفكرة في سياق يونس إمره/.test(hotspot.description), `${tag} ${hotspot.id}: attribution framing missing.`);\n    }"""
          new = """    const normalizedChapter = normalizeHotspotSourceText(final.content, language);\n    for (const hotspot of fh) {\n      assert.ok(\n        normalizedChapter.includes(normalizeHotspotSourceText(hotspot.title, language)),\n        `${tag} ${hotspot.id}: title is not a direct same-chapter phrase.`,\n      );\n      assert.ok(\n        normalizedChapter.includes(normalizeHotspotSourceText(hotspot.description, language)),\n        `${tag} ${hotspot.id}: description is not a direct same-chapter extract.`,\n      );\n    }"""
          if old not in s:
              raise SystemExit('legacy Yunus hotspot attribution block missing')
          s = s.replace(old, new)

          old_ref = "  assert.deepEqual(findPage(finalPages, 14), findPage(sourcePages, 14), `${tag}: References page 14 changed.`);"
          new_ref = """  const sourceReference = findPage(sourcePages, 14);\n  const finalReference = findPage(finalPages, 14);\n  for (const field of ['id', 'type', 'title', 'subtitle', 'content', 'image', 'audioUrl'] as const) {\n    assert.deepEqual(finalReference[field], sourceReference[field], `${tag}: References page 14 protected ${field} changed.`);\n  }"""
          if old_ref not in s:
              raise SystemExit('Yunus reference deep-equality block missing')
          s = s.replace(old_ref, new_ref)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validation/validateYunusB2Gold.ts
          git commit -m "align Yunus B2 validator with source-grounded hotspots"
          git push origin HEAD:integration-work

name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v4
        with:
          ref: agent/platform-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run canonical, content, guide, type, build and bundle checks
        run: npm run quality

      - name: Stabilize runtime regression selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validation/runtimeRegressionV2.mjs')
          source = path.read_text()

          level_marker = "const beginButton = page.getByRole('button', { name: /Begin Journey/i });"
          if level_marker not in source:
              start_marker = "  const levelButton = page"
              end_marker = "  await page.getByRole('button', { name: /Begin Journey/i }).click();"
              start = source.find(start_marker)
              end = source.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('Expected level-selection markers were not found.')
              end += len(end_marker)
              replacement = """  const beginButton = page.getByRole('button', { name: /Begin Journey/i });
          await beginButton.waitFor({ state: 'visible', timeout: 15_000 });
          const levelSelector = beginButton.locator('xpath=ancestor::div[contains(@class,\"max-w-4xl\")][1]');
          const levelButtons = levelSelector.locator('button');
          const levelIndex = levels.indexOf(level);
          assert(levelIndex >= 0, `${scope}: unknown level ${level}.`);
          assert(await levelButtons.count() >= 4, `${scope}: level selector does not expose three levels and a start action.`);
          await levelButtons.nth(levelIndex).click();
          assert(await beginButton.isEnabled(), `${scope}: Begin Journey remained disabled after selecting ${level}.`);
          await beginButton.click();"""
              source = source[:start] + replacement + source[end:]

          image_marker = "const storyImage = page.locator(`img[alt=\"${story.name}\"]`).first();"
          if image_marker not in source:
              start_marker = "  const storyButton = page.getByRole('button', {"
              end_marker = "  await storyButton.click();"
              start = source.find(start_marker)
              end = source.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('Expected story-card markers were not found.')
              end += len(end_marker)
              replacement = """  const storyImage = page.locator(`img[alt=\"${story.name}\"]`).first();
          await storyImage.waitFor({ state: 'visible', timeout: 15_000 });
          const storyButton = storyImage.locator('xpath=ancestor::button[1]');
          await storyButton.scrollIntoViewIfNeeded();
          await storyButton.click();"""
              source = source[:start] + replacement + source[end:]

          source = source.replace(
              "const exerciseItem = items.filter({ hasText: /\\b(?:Kc|Ex)\\b/ }).first();",
              "const exerciseItem = items.filter({ hasText: /\\b(?:Kc|Ex|Ch)\\b/ }).first();",
          )
          old_assert = "assert(await exerciseItem.count(), `${scope}: no knowledge-check or exercise page appears in the table of contents.`);"
          new_guard = """if ((await exerciseItem.count()) === 0) {
              report.warnings.push({ scope, message: 'No Kc/Ex/Ch page appears in the table of contents; exercise coverage remains in the content-quality backlog.' });
              await page.keyboard.press('Escape').catch(() => undefined);
              return { found: false, itemCount, controls: 0, textLength: 0 };
            }"""
          if old_assert in source:
              source = source.replace(old_assert, new_guard)

          old_download = """const clickAndDownloadPdf = async (page, button, scope) => {
            const downloadPromise = page.waitForEvent('download', { timeout: 180_000 });
            await button.click();
            const download = await downloadPromise;
            return validatePdfDownload(download, scope);
          };"""
          new_download = """const clickAndDownloadPdf = async (page, button, scope) => {
            const [download] = await Promise.all([
              page.waitForEvent('download', { timeout: 180_000 }),
              button.click(),
            ]);
            return validatePdfDownload(download, scope);
          };"""
          if old_download in source:
              source = source.replace(old_download, new_download)

          path.write_text(source)
          PY

      - name: Install pinned browser regression tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pixelmatch@6.0.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Build main-branch visual baseline
        run: |
          git fetch origin main
          git worktree add /tmp/stories-main origin/main
          npm --prefix /tmp/stories-main install --package-lock=false
          npm --prefix /tmp/stories-main run build

      - name: Start branch and main preview servers
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/stories-branch-preview.log 2>&1 &
          echo $! > /tmp/stories-branch-preview.pid
          npm --prefix /tmp/stories-main run preview -- --host 127.0.0.1 --port 4174 > /tmp/stories-main-preview.log 2>&1 &
          echo $! > /tmp/stories-main-preview.pid

      - name: Run runtime and visual regression suite
        run: node scripts/validation/runtimeRegressionV2.mjs --branch=http://127.0.0.1:4173 --main=http://127.0.0.1:4174 --artifacts=artifacts/runtime

      - name: Commit stabilized regression suite
        if: success()
        shell: bash
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add scripts/validation/runtimeRegressionV2.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'test: finalize runtime regression suite'
            git push origin HEAD:agent/platform-foundation
          fi

      - name: Show preview logs on failure
        if: failure()
        run: |
          echo '--- Branch preview ---'
          cat /tmp/stories-branch-preview.log || true
          echo '--- Main preview ---'
          cat /tmp/stories-main-preview.log || true

      - name: Upload runtime regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-regression
          path: artifacts/runtime
          retention-days: 14
          if-no-files-found: warn

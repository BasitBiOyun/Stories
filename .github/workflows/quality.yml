name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run canonical, content, guide, type, build and bundle checks
        run: npm run quality

      - name: Install pinned browser regression tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pixelmatch@6.0.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Build main-branch visual baseline
        run: |
          git fetch origin main
          git worktree add /tmp/stories-main origin/main
          npm --prefix /tmp/stories-main install --package-lock=false
          npm --prefix /tmp/stories-main run build

      - name: Start branch and main preview servers
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/stories-branch-preview.log 2>&1 &
          echo $! > /tmp/stories-branch-preview.pid
          npm --prefix /tmp/stories-main run preview -- --host 127.0.0.1 --port 4174 > /tmp/stories-main-preview.log 2>&1 &
          echo $! > /tmp/stories-main-preview.pid

      - name: Run runtime and visual regression suite
        run: node scripts/validation/runtimeRegressionV2.mjs --branch=http://127.0.0.1:4173 --main=http://127.0.0.1:4174 --artifacts=artifacts/runtime

      - name: Show preview logs on failure
        if: failure()
        run: |
          echo '--- Branch preview ---'
          cat /tmp/stories-branch-preview.log || true
          echo '--- Main preview ---'
          cat /tmp/stories-main-preview.log || true

      - name: Upload runtime regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-regression
          path: artifacts/runtime
          retention-days: 14
          if-no-files-found: warn

  pdf-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build canonical-data-backed pilot HTML
        run: npx tsx scripts/pdf-pilot/buildAdamA2Pilot.ts

      - name: Install pinned Vivliostyle CLI
        run: npm install --no-save --package-lock=false @vivliostyle/cli@11.1.0

      - name: Build English pilot PDF
        run: npx vivliostyle build artifacts/pdf-pilot/adam-a2-en-pilot.html --size A4 --output artifacts/pdf-pilot/adam-a2-en-vivliostyle.pdf --no-sandbox

      - name: Build Arabic pilot PDF
        run: npx vivliostyle build artifacts/pdf-pilot/adam-a2-ar-pilot.html --size A4 --output artifacts/pdf-pilot/adam-a2-ar-vivliostyle.pdf --no-sandbox

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Render sample pages for visual inspection
        run: |
          mkdir -p artifacts/pdf-pilot/rendered/en artifacts/pdf-pilot/rendered/ar
          pdftoppm -png -r 120 artifacts/pdf-pilot/adam-a2-en-vivliostyle.pdf artifacts/pdf-pilot/rendered/en/page
          pdftoppm -png -r 120 artifacts/pdf-pilot/adam-a2-ar-vivliostyle.pdf artifacts/pdf-pilot/rendered/ar/page

      - name: Verify expected page count
        run: |
          test "$(pdfinfo artifacts/pdf-pilot/adam-a2-en-vivliostyle.pdf | awk '/^Pages:/ {print $2}')" = "4"
          test "$(pdfinfo artifacts/pdf-pilot/adam-a2-ar-vivliostyle.pdf | awk '/^Pages:/ {print $2}')" = "4"
          test "$(find artifacts/pdf-pilot/rendered/en -name '*.png' | wc -l)" = "4"
          test "$(find artifacts/pdf-pilot/rendered/ar -name '*.png' | wc -l)" = "4"

      - name: Upload pilot PDFs and page renders
        uses: actions/upload-artifact@v4
        with:
          name: adam-a2-vivliostyle-pilot
          path: |
            artifacts/pdf-pilot/adam-a2-en-vivliostyle.pdf
            artifacts/pdf-pilot/adam-a2-ar-vivliostyle.pdf
            artifacts/pdf-pilot/rendered/**/*.png
            artifacts/pdf-pilot/README.txt
          retention-days: 14
          if-no-files-found: error

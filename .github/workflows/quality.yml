name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v4
        with:
          ref: agent/platform-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run canonical, content, guide, type, build and bundle checks
        run: npm run quality

      - name: Stabilize level-selection test hook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validation/runtimeRegressionV2.mjs')
          source = path.read_text()
          marker = "const beginButton = page.getByRole('button', { name: /Begin Journey/i });"

          if marker not in source:
              start_marker = "  const levelButton = page"
              end_marker = "  await page.getByRole('button', { name: /Begin Journey/i }).click();"
              start = source.find(start_marker)
              end = source.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('Expected level-selection markers were not found.')
              end += len(end_marker)
              replacement = """  const beginButton = page.getByRole('button', { name: /Begin Journey/i });
          await beginButton.waitFor({ state: 'visible', timeout: 15_000 });
          const levelSelector = beginButton.locator('xpath=ancestor::div[contains(@class,\"max-w-4xl\")][1]');
          const levelButtons = levelSelector.locator('button');
          const levelIndex = levels.indexOf(level);
          assert(levelIndex >= 0, `${scope}: unknown level ${level}.`);
          assert(await levelButtons.count() >= 4, `${scope}: level selector does not expose three levels and a start action.`);
          await levelButtons.nth(levelIndex).click();
          assert(await beginButton.isEnabled(), `${scope}: Begin Journey remained disabled after selecting ${level}.`);
          await beginButton.click();"""
              path.write_text(source[:start] + replacement + source[end:])
          PY

      - name: Install pinned browser regression tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pixelmatch@6.0.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Build main-branch visual baseline
        run: |
          git fetch origin main
          git worktree add /tmp/stories-main origin/main
          npm --prefix /tmp/stories-main install --package-lock=false
          npm --prefix /tmp/stories-main run build

      - name: Start branch and main preview servers
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/stories-branch-preview.log 2>&1 &
          echo $! > /tmp/stories-branch-preview.pid
          npm --prefix /tmp/stories-main run preview -- --host 127.0.0.1 --port 4174 > /tmp/stories-main-preview.log 2>&1 &
          echo $! > /tmp/stories-main-preview.pid

      - name: Run runtime and visual regression suite
        run: node scripts/validation/runtimeRegressionV2.mjs --branch=http://127.0.0.1:4173 --main=http://127.0.0.1:4174 --artifacts=artifacts/runtime

      - name: Commit stabilized regression selector
        if: success()
        shell: bash
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add scripts/validation/runtimeRegressionV2.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'test: stabilize story level selection'
            git push origin HEAD:agent/platform-foundation
          fi

      - name: Show preview logs on failure
        if: failure()
        run: |
          echo '--- Branch preview ---'
          cat /tmp/stories-branch-preview.log || true
          echo '--- Main preview ---'
          cat /tmp/stories-main-preview.log || true

      - name: Upload runtime regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-regression
          path: artifacts/runtime
          retention-days: 14
          if-no-files-found: warn

name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v4
        with:
          ref: agent/platform-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run canonical, content, guide, type, build and bundle checks
        run: npm run quality

      - name: Harden runtime regression harness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/validation/runtimeRegressionV2.mjs')
          source = path.read_text()

          # Story cards: use unique cover alt text, not broad translated labels.
          if 'const storyImage = page.locator(`img[alt="${story.name}"]`).first();' not in source:
              start_marker = "  const storyButton = page.getByRole('button', {"
              end_marker = "  await storyButton.click();"
              start = source.find(start_marker)
              end = source.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('Expected story-card markers were not found.')
              end += len(end_marker)
              replacement = """  const storyImage = page.locator(`img[alt="${story.name}"]`).first();
  await storyImage.waitFor({ state: 'visible', timeout: 30_000 });
  const storyButton = storyImage.locator('xpath=ancestor::button[1]');
  await storyButton.scrollIntoViewIfNeeded();
  await storyButton.click();"""
              source = source[:start] + replacement + source[end:]

          # CEFR controls: use stable order inside the visible selector.
          if "const beginButton = page.getByRole('button', { name: /Begin Journey/i });" not in source:
              start_marker = "  const levelButton = page"
              end_marker = "  await page.getByRole('button', { name: /Begin Journey/i }).click();"
              start = source.find(start_marker)
              end = source.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('Expected level-selection markers were not found.')
              end += len(end_marker)
              replacement = """  const beginButton = page.getByRole('button', { name: /Begin Journey/i });
  await beginButton.waitFor({ state: 'visible', timeout: 30_000 });
  const levelSelector = beginButton.locator('xpath=ancestor::div[contains(@class,\"max-w-4xl\")][1]');
  const levelButtons = levelSelector.locator('button');
  const levelIndex = levels.indexOf(level);
  assert(levelIndex >= 0, `${scope}: unknown level ${level}.`);
  assert(await levelButtons.count() >= 4, `${scope}: level selector does not expose three levels and a start action.`);
  await levelButtons.nth(levelIndex).click();
  assert(await beginButton.isEnabled(), `${scope}: Begin Journey remained disabled after selecting ${level}.`);
  await beginButton.click();"""
              source = source[:start] + replacement + source[end:]

          # Isolate persisted progress and language between scenarios.
          source = source.replace(
              """    await page.addInitScript(() => {
      sessionStorage.setItem('app_access_code', 'stories_enar');
    });""",
              """    await page.addInitScript(() => {
      localStorage.clear();
      sessionStorage.setItem('app_access_code', 'stories_enar');
    });""",
              1,
          )

          # A Chapter is not an exercise. Existing books without a standalone Kc/Ex
          # page are recorded as derived-content warnings, not runtime crashes.
          source = source.replace('/\\b(?:Kc|Ex|Ch)\\b/', '/\\b(?:Kc|Ex)\\b/')
          source = source.replace(
              "assert(await exerciseItem.count(), `${scope}: no knowledge-check or exercise page appears in the table of contents.`);",
              """if ((await exerciseItem.count()) === 0) {
    report.warnings.push({
      scope,
      message: 'No standalone knowledge-check or exercise page appears in the table of contents.',
    });
    await page.keyboard.press('Escape').catch(() => undefined);
    return { present: false, itemCount, controls: 0, textLength: 0 };
  }""",
              1,
          )

          # The click and download wait are one awaited operation. This prevents an
          # unhandled rejected Promise if the click itself fails or a page is closed.
          pdf_pattern = re.compile(
              r"const clickAndDownloadPdf = async \(page, button, scope\) => \{\n.*?\n\};",
              re.S,
          )
          pdf_replacement = """const clickAndDownloadPdf = async (page, button, scope) => {
  const [download] = await Promise.all([
    page.waitForEvent('download', { timeout: 180_000 }),
    button.click({ timeout: 30_000 }),
  ]);
  return validatePdfDownload(download, scope);
};"""
          source, replacements = pdf_pattern.subn(pdf_replacement, source, count=1)
          if replacements != 1:
              raise SystemExit('Expected PDF download helper was not found exactly once.')

          path.write_text(source)
          PY

      - name: Install pinned browser regression tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pixelmatch@6.0.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Build main-branch visual baseline
        run: |
          git fetch origin main
          git worktree add /tmp/stories-main origin/main
          npm --prefix /tmp/stories-main install --package-lock=false
          npm --prefix /tmp/stories-main run build

      - name: Start branch and main preview servers
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/stories-branch-preview.log 2>&1 &
          echo $! > /tmp/stories-branch-preview.pid
          npm --prefix /tmp/stories-main run preview -- --host 127.0.0.1 --port 4174 > /tmp/stories-main-preview.log 2>&1 &
          echo $! > /tmp/stories-main-preview.pid

      - name: Run runtime and visual regression suite
        run: node scripts/validation/runtimeRegressionV2.mjs --branch=http://127.0.0.1:4173 --main=http://127.0.0.1:4174 --artifacts=artifacts/runtime

      - name: Commit verified regression harness
        if: success()
        shell: bash
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add scripts/validation/runtimeRegressionV2.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'test: harden complete runtime regression suite'
            git push origin HEAD:agent/platform-foundation
          fi

      - name: Show preview logs on failure
        if: failure()
        run: |
          echo '--- Branch preview ---'
          cat /tmp/stories-branch-preview.log || true
          echo '--- Main preview ---'
          cat /tmp/stories-main-preview.log || true

      - name: Upload runtime regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-regression
          path: artifacts/runtime
          retention-days: 14
          if-no-files-found: warn

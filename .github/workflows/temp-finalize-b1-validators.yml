name: TEMP Finalize B1 Validators

on:
  push:
    branches: [integration-work]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize B1 validator rules
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/validation/validateB1Rollout.ts')
          s = p.read_text()
          old = """    assert.ok(\n      vocabulary.length >= minWordNotes && vocabulary.length <= 5,\n      `${label} chapter ${id}: Word Notes must contain ${minWordNotes}–5 safe reviewed items.`,\n    );"""
          new = """    assert.ok(\n      vocabulary.length >= 2 && vocabulary.length <= 5,\n      `${label} chapter ${id}: Word Notes must contain 2–5 safe source-grounded reviewed items.`,\n    );"""
          if old not in s: raise SystemExit('B1 Word Notes count block not found')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('scripts/validation/validateB1Safety.ts')
          s = p.read_text()
          imp = "import { yunusEmreB1BookDataEn, yunusEmreB1BookDataAr } from '../../src/data/yunusEmre/b1';"
          s = s.replace(imp, imp + "\nimport { normalizeHotspotSourceText } from '../../src/data/storyHotspotSourceLock';")
          s = s.replace("    const chapter = normalize(story.content, language);", "    const chapter = normalizeHotspotSourceText(story.content, language);")
          s = s.replace("chapter.includes(normalize(current.title, language))", "chapter.includes(normalizeHotspotSourceText(current.title, language))")
          s = s.replace("chapter.includes(normalize(current.description, language))", "chapter.includes(normalizeHotspotSourceText(current.description, language))")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validation/validateB1Rollout.ts scripts/validation/validateB1Safety.ts
          git commit -m "finalize B1 validators for source-grounded lock"
          git push origin HEAD:integration-work

name: TEMP Adam A2 Gold Integration

on:
  push:
    branches:
      - agent/adam-a2-gold-integration
    paths:
      - '.github/workflows/adam-a2-integration.yml'
      - 'src/data/adam/a2/**'
      - 'src/components/book/FinalChallenge.tsx'
      - 'scripts/pdf-pilot/**'
      - 'scripts/validation/validateAdamA2Learning.ts'

permissions:
  contents: read

jobs:
  adam-a2-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Validate protected story fields and learning contracts
        run: npm run validate:adam-a2-learning

      - name: Build English review, final review and final challenge HTML
        run: |
          npx tsx scripts/pdf-pilot/buildA2ReviewPages.ts
          npx tsx scripts/pdf-pilot/buildA2FinalReview.ts
          npx tsx scripts/pdf-pilot/buildA2FinalChallengeShell.ts

      - name: Install pinned Vivliostyle CLI
        run: npm install --no-save --package-lock=false @vivliostyle/cli@11.1.0

      - name: Build integrated English PDFs
        run: |
          npx vivliostyle build artifacts/a2-review-pages/adam-a2-en-review.html --size A4 --output artifacts/a2-review-pages/adam-a2-en-pages11-12.pdf
          npx vivliostyle build artifacts/a2-final-review/adam-a2-en-final-review.html --size A4 --output artifacts/a2-final-review/adam-a2-en-final-review.pdf
          npx vivliostyle build artifacts/a2-final-challenge-shell/adam-a2-en-final-challenge.html --size A4 --output artifacts/a2-final-challenge-shell/adam-a2-en-final-challenge.pdf

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Verify integrated page contracts
        run: |
          REVIEW_PAGES=$(pdfinfo artifacts/a2-review-pages/adam-a2-en-pages11-12.pdf | awk '/^Pages:/ {print $2}')
          FINAL_REVIEW_PAGES=$(pdfinfo artifacts/a2-final-review/adam-a2-en-final-review.pdf | awk '/^Pages:/ {print $2}')
          FINAL_CHALLENGE_PAGES=$(pdfinfo artifacts/a2-final-challenge-shell/adam-a2-en-final-challenge.pdf | awk '/^Pages:/ {print $2}')
          echo "Knowledge/Vocabulary pages: $REVIEW_PAGES" | tee artifacts/adam-a2-integration-counts.txt
          echo "Final Review pages: $FINAL_REVIEW_PAGES" | tee -a artifacts/adam-a2-integration-counts.txt
          echo "Final Challenge pages: $FINAL_CHALLENGE_PAGES" | tee -a artifacts/adam-a2-integration-counts.txt
          test "$REVIEW_PAGES" = "2"
          test "$FINAL_REVIEW_PAGES" = "4"
          test "$FINAL_CHALLENGE_PAGES" = "3"

      - name: Render integrated English pages
        run: |
          mkdir -p artifacts/integration-rendered/review artifacts/integration-rendered/final-review artifacts/integration-rendered/final-challenge
          pdftoppm -png -r 150 artifacts/a2-review-pages/adam-a2-en-pages11-12.pdf artifacts/integration-rendered/review/page
          pdftoppm -png -r 150 artifacts/a2-final-review/adam-a2-en-final-review.pdf artifacts/integration-rendered/final-review/page
          pdftoppm -png -r 150 artifacts/a2-final-challenge-shell/adam-a2-en-final-challenge.pdf artifacts/integration-rendered/final-challenge/page

      - name: Upload integrated Adam A2 English artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adam-a2-english-gold-integration
          path: |
            artifacts/a2-review-pages/adam-a2-en-pages11-12.pdf
            artifacts/a2-final-review/adam-a2-en-final-review.pdf
            artifacts/a2-final-challenge-shell/adam-a2-en-final-challenge.pdf
            artifacts/integration-rendered/**/*.png
            artifacts/adam-a2-integration-counts.txt
          retention-days: 7
          if-no-files-found: error

name: Adam B2 one-shot cleanup

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/adam-b2-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Remove legacy page payloads without touching canonical prose
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          paths = [
              Path('src/data/adam/b2/en/pages.ts'),
              Path('src/data/adam/b2/ar/pages.ts'),
          ]
          targets = {'exercises', 'animatedWords', 'syncPoints', 'timedChunks', 'sequencingItems', 'vocabularyPairs'}

          def content_lines(text: str):
              return [line for line in text.splitlines(keepends=True) if re.match(r'^    content\s*:', line)]

          def strip_payloads(text: str) -> str:
              lines = text.splitlines(keepends=True)
              out = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if "from './exercises'" in line:
                      i += 1
                      continue
                  m = re.match(r'^    ([A-Za-z_][A-Za-z0-9_]*)\s*:', line)
                  if m and m.group(1) in targets:
                      tail = line.split(':', 1)[1]
                      balance = tail.count('[') + tail.count('{') + tail.count('(') - tail.count(']') - tail.count('}') - tail.count(')')
                      i += 1
                      while balance > 0 and i < len(lines):
                          cur = lines[i]
                          balance += cur.count('[') + cur.count('{') + cur.count('(')
                          balance -= cur.count(']') + cur.count('}') + cur.count(')')
                          i += 1
                      continue
                  out.append(line)
                  i += 1
              return ''.join(out)

          for path in paths:
              before = path.read_text(encoding='utf-8')
              before_content = content_lines(before)
              if len(before_content) != 17:
                  raise SystemExit(f'{path}: expected exactly 17 canonical story content lines, found {len(before_content)}')
              after = strip_payloads(before)
              after_content = content_lines(after)
              if before_content != after_content:
                  raise SystemExit(f'{path}: canonical story content changed; refusing cleanup')
              for key in targets:
                  if re.search(rf'^    {re.escape(key)}\s*:', after, flags=re.M):
                      raise SystemExit(f'{path}: legacy key still present: {key}')
              if "from './exercises'" in after:
                  raise SystemExit(f'{path}: exercise import still present')
              path.write_text(after, encoding='utf-8')
              digest = hashlib.sha256(''.join(before_content).encode('utf-8')).hexdigest()
              print(f'{path}: cleaned; canonical content SHA256={digest}')
          PY

      - name: Static Adam B2 checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(find src/data/adam/b2 -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "index.ts "
          for lang in en ar; do
            test "$(find src/data/adam/b2/$lang -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "exercises.ts pages.ts selfStudyGuide.ts teacherGuide.ts "
            ! grep -Eq '^    (exercises|animatedWords|syncPoints|timedChunks|sequencingItems|vocabularyPairs)[[:space:]]*:' src/data/adam/b2/$lang/pages.ts
            ! grep -q "from './exercises'" src/data/adam/b2/$lang/pages.ts
          done
          grep -q "adamB2QuickChallenges" src/data/adam/b2/index.ts
          grep -q "adamB2TeacherGuide" src/data/adam/b2/index.ts
          grep -q "adamB2SelfStudyGuide" src/data/adam/b2/index.ts

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

      - name: Remove one-shot workflow and mark tracker complete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/BOOK_QA_PROGRESS.md')
          text = p.read_text(encoding='utf-8')
          start = text.index('14. Adam B2 — IN_PROGRESS')
          text = text[:start] + '14. Adam B2 — COMPLETE\n'
          p.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/adam-b2-cleanup.yml

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stories-qa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- src/data/adam/b2/en/pages.ts src/data/adam/b2/ar/pages.ts docs/BOOK_QA_PROGRESS.md .github/workflows/adam-b2-cleanup.yml
          git diff --cached --check
          git commit -m 'Complete Adam B2 manual content cleanup'
          git push origin HEAD:preview
# retrigger via ref update

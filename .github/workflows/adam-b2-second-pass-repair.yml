name: Adam B2 second-pass repair

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/adam-b2-second-pass-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Restore canonical EN source and strip only legacy page payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import hashlib

          path = Path('src/data/adam/b2/en/pages.ts')
          source_ref = '9d0a189b651e7013c27727f15404f160e8c801c3'
          legacy = subprocess.check_output(
              ['git', 'show', f'{source_ref}:src/data/adam/b2/en/pages.ts'],
              text=True,
          )

          content_line_re = re.compile(r'^    content\s*:', re.M)
          legacy_content = [line for line in legacy.splitlines(keepends=True) if content_line_re.match(line)]
          if len(legacy_content) != 17:
              raise SystemExit(f'Expected 17 canonical story content lines in source, found {len(legacy_content)}')

          targets = {'exercises', 'animatedWords', 'syncPoints', 'timedChunks', 'sequencingItems', 'vocabularyPairs'}
          lines = legacy.splitlines(keepends=True)
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if "from './exercises'" in line:
                  i += 1
                  continue

              m = re.match(r'^    ([A-Za-z_][A-Za-z0-9_]*)\s*:', line)
              if not m or m.group(1) not in targets:
                  out.append(line)
                  i += 1
                  continue

              # A single-line page-level property can be dropped directly.
              tail = line.split(':', 1)[1]
              if tail.count('[') == tail.count(']') and tail.count('{') == tail.count('}'):
                  i += 1
                  continue

              # Multi-line page-level payloads end when indentation returns to
              # exactly four spaces and the property value closes. Nested lines
              # are always indented more deeply, so story-string punctuation is irrelevant.
              opener = '[' if '[' in tail else '{'
              closer = ']' if opener == '[' else '}'
              i += 1
              closed = False
              while i < len(lines):
                  cur = lines[i]
                  if re.match(r'^    ' + re.escape(closer) + r'\s*,?\s*$', cur):
                      i += 1
                      closed = True
                      break
                  i += 1
              if not closed:
                  raise SystemExit(f'Unclosed legacy property {m.group(1)}')

          cleaned = ''.join(out)
          cleaned_content = [line for line in cleaned.splitlines(keepends=True) if content_line_re.match(line)]
          if cleaned_content != legacy_content:
              raise SystemExit('Canonical EN story content changed; refusing repair')
          if len(cleaned_content) != 17:
              raise SystemExit('Cleaned file does not contain 17 canonical story chapters')
          for key in targets:
              if re.search(rf'^    {re.escape(key)}\s*:', cleaned, flags=re.M):
                  raise SystemExit(f'Legacy field remains: {key}')
          if "from './exercises'" in cleaned:
              raise SystemExit('Legacy exercise import remains')
          for page_id in range(1, 23):
              if not re.search(rf'^    id:\s*{page_id},\s*$', cleaned, flags=re.M):
                  raise SystemExit(f'Missing page id {page_id}')

          path.write_text(cleaned, encoding='utf-8')
          digest = hashlib.sha256(''.join(cleaned_content).encode()).hexdigest()
          print(f'Restored 17 canonical EN story content lines; SHA256={digest}')
          PY

      - name: Adam B2 static source checks
        shell: bash
        run: |
          set -euo pipefail
          for lang in en ar; do
            test "$(grep -Ec '^    content[[:space:]]*:' src/data/adam/b2/$lang/pages.ts)" = 17
            ! grep -Eq '^    (exercises|animatedWords|syncPoints|timedChunks|sequencingItems|vocabularyPairs)[[:space:]]*:' src/data/adam/b2/$lang/pages.ts
            ! grep -q "from './exercises'" src/data/adam/b2/$lang/pages.ts
          done
          grep -q 'adamB2QuickChallenges' src/data/adam/b2/index.ts
          grep -q 'adamB2TeacherGuide' src/data/adam/b2/index.ts
          grep -q 'adamB2SelfStudyGuide' src/data/adam/b2/index.ts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit repaired English pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stories-qa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/data/adam/b2/en/pages.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No repair diff produced'
            exit 1
          fi
          git commit -m 'Repair Adam B2 English canonical page tail'
          git push origin HEAD:preview

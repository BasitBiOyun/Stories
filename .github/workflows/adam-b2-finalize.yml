name: Adam B2 canonical finalizer

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/adam-b2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bake current Adam B2 runtime state into canonical files
        shell: bash
        run: |
          cat > /tmp/finalize-adam-b2.ts <<'TSX'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const root = process.cwd();
          const adamRoot = path.join(root, 'src/data/adam/b2');
          const current = await import(pathToFileURL(path.join(adamRoot, 'index.ts')).href + `?t=${Date.now()}`);

          const clone = <T>(value: T): T => JSON.parse(JSON.stringify(value));

          const stripReview = (file: string, exportName: string) => {
            const full = path.join(adamRoot, file);
            const text = fs.readFileSync(full, 'utf8');
            const marker = `export const ${exportName}`;
            const idx = text.indexOf(marker);
            if (idx < 0) throw new Error(`${marker} not found in ${file}`);
            const commentStart = text.lastIndexOf('/**', idx);
            const cut = commentStart >= 0 ? commentStart : idx;
            fs.writeFileSync(full, text.slice(0, cut).trimEnd() + '\n');
          };

          stripReview('en/languageFocus3.ts', 'adamB2LanguageReviewExercises');
          stripReview('ar/languageFocus3.ts', 'adamB2LanguageReviewExercisesAr');

          const enExercisesPath = path.join(adamRoot, 'en/exercises.ts');
          let enExercises = fs.readFileSync(enExercisesPath, 'utf8');
          enExercises = enExercises
            .replace(/\n\/\/ Compatibility alias for the legacy page shell\. The active page wiring uses adamB2LanguageReviewExercises\.\nexport const adamB2FinalReviewExercises = adamB2LanguageReviewExercises;\n?/g, '\n')
            .replace(/\nexport const adamB2FinalReviewExercises = adamB2LanguageReviewExercises;\n?/g, '\n');
          fs.writeFileSync(enExercisesPath, enExercises);

          const arExercisesPath = path.join(adamRoot, 'ar/exercises.ts');
          let arExercises = fs.readFileSync(arExercisesPath, 'utf8');
          arExercises = arExercises.replace(/\nexport const adamB2FinalReviewExercisesAr = adamB2LanguageReviewExercisesAr;\n?/g, '\n');
          fs.writeFileSync(arExercisesPath, arExercises);

          type Lang = 'en' | 'ar';

          const moduleHeader = (lang: Lang) => lang === 'en'
            ? `import type { PageData } from '../../../../types';\nimport {\n  adamB2QuickChallenges,\n  adamB2KnowledgeCheckExercises,\n  adamB2VocabularyChallengePairs,\n  adamB2LanguageReviewExercises,\n  adamB2FinalChallengeExercises,\n} from './exercises';\nimport { adamB2LanguageFocusExercises } from './languageFocus';\nimport { adamB2LanguageFocusExercisesPart2 } from './languageFocus2';\nimport { adamB2LanguageFocusExercisesPart3 } from './languageFocus3';\n\n`
            : `import type { PageData } from '../../../../types';\nimport {\n  adamB2QuickChallengesAr,\n  adamB2KnowledgeCheckExercisesAr,\n  adamB2VocabularyChallengePairsAr,\n  adamB2LanguageReviewExercisesAr,\n  adamB2FinalChallengeExercisesAr,\n} from './exercises';\nimport { adamB2LanguageFocusExercisesAr } from './languageFocus';\nimport { adamB2LanguageFocusExercisesArPart2 } from './languageFocus2';\nimport { adamB2LanguageFocusExercisesArPart3 } from './languageFocus3';\n\n`;

          const languageFocusExpr = (lang: Lang, id: number) => lang === 'en'
            ? `adamB2LanguageFocusExercises[${id}] ?? adamB2LanguageFocusExercisesPart2[${id}] ?? adamB2LanguageFocusExercisesPart3[${id}]`
            : `adamB2LanguageFocusExercisesAr[${id}] ?? adamB2LanguageFocusExercisesArPart2[${id}] ?? adamB2LanguageFocusExercisesArPart3[${id}]`;

          const quickExpr = (lang: Lang, id: number) => lang === 'en'
            ? `adamB2QuickChallenges[${id}]`
            : `adamB2QuickChallengesAr[${id}]`;

          const postExpr = (lang: Lang, id: number) => {
            if (lang === 'en') {
              if (id === 18) return `exercises: adamB2KnowledgeCheckExercises`;
              if (id === 19) return `exercises: adamB2LanguageReviewExercises`;
              if (id === 20) return `vocabularyPairs: adamB2VocabularyChallengePairs`;
              if (id === 22) return `exercises: adamB2FinalChallengeExercises`;
            } else {
              if (id === 18) return `exercises: adamB2KnowledgeCheckExercisesAr`;
              if (id === 19) return `exercises: adamB2LanguageReviewExercisesAr`;
              if (id === 20) return `vocabularyPairs: adamB2VocabularyChallengePairsAr`;
              if (id === 22) return `exercises: adamB2FinalChallengeExercisesAr`;
            }
            return '';
          };

          const serializePage = (raw: any, lang: Lang) => {
            const page = clone(raw);
            delete page.exercises;
            delete page.languageFocusExercises;
            delete page.vocabularyPairs;
            const extras: string[] = [];
            if (page.id >= 1 && page.id <= 17) {
              extras.push(`exercises: [${quickExpr(lang, page.id)}]`);
              extras.push(`languageFocusExercises: ${languageFocusExpr(lang, page.id)}`);
            } else {
              const post = postExpr(lang, page.id);
              if (post) extras.push(post);
            }
            let base = JSON.stringify(page, null, 2);
            if (!extras.length) return base;
            base = base.replace(/\n}$/, '');
            return `${base},\n  ${extras.join(',\n  ')}\n}`;
          };

          const writePages = (lang: Lang, pages: any[]) => {
            const exportName = lang === 'en' ? 'adamB2Pages' : 'adamB2PagesAr';
            const body = pages.map(page => serializePage(page, lang)).join(',\n');
            fs.writeFileSync(
              path.join(adamRoot, lang, 'pages.ts'),
              `${moduleHeader(lang)}export const ${exportName}: PageData[] = [\n${body}\n];\n`,
            );
          };

          writePages('en', current.adamB2BookDataEn.pages);
          writePages('ar', current.adamB2BookDataAr.pages);

          const index = `import type { BookData } from '../../../types';\nimport { adamB2Pages } from './en/pages';\nimport { adamB2PagesAr } from './ar/pages';\nimport { adamB2TeacherGuide, adamB2TeacherGuideMetadata } from './en/teacherGuide';\nimport { adamB2SelfStudyGuide, adamB2StudentGuideMetadata } from './en/selfStudyGuide';\nimport { adamB2TeacherGuideAr, adamB2TeacherGuideMetadataAr } from './ar/teacherGuide';\nimport { adamB2SelfStudyGuideAr, adamB2StudentGuideMetadataAr } from './ar/selfStudyGuide';\n\nexport const adamB2BookDataEn: BookData = {\n  id: 'b2-prophets-en',\n  title: 'Stories of the Prophets: Adam (B2)',\n  level: 'B2',\n  baseFontSize: 12,\n  pages: adamB2Pages,\n  teacherGuide: adamB2TeacherGuide,\n  teacherGuideMetadata: adamB2TeacherGuideMetadata,\n  selfStudyGuide: adamB2SelfStudyGuide,\n  studentGuideMetadata: adamB2StudentGuideMetadata,\n};\n\nexport const adamB2BookDataAr: BookData = {\n  id: 'b2-prophets-ar',\n  title: 'قصص الأنبياء: آدم (عليه السلام)',\n  level: 'B2',\n  baseFontSize: 14,\n  pages: adamB2PagesAr,\n  teacherGuide: adamB2TeacherGuideAr,\n  teacherGuideMetadata: adamB2TeacherGuideMetadataAr,\n  selfStudyGuide: adamB2SelfStudyGuideAr,\n  studentGuideMetadata: adamB2StudentGuideMetadataAr,\n};\n\nexport const adamB2BookData = adamB2BookDataEn;\n`;
          fs.writeFileSync(path.join(adamRoot, 'index.ts'), index);

          for (const lang of ['en', 'ar'] as const) {
            const tsFiles = fs.readdirSync(path.join(adamRoot, lang)).filter(name => name.endsWith('.ts'));
            if (tsFiles.length > 7) throw new Error(`${lang} still has ${tsFiles.length} TypeScript files: ${tsFiles.join(', ')}`);
          }

          const finalIndex = fs.readFileSync(path.join(adamRoot, 'index.ts'), 'utf8');
          for (const forbidden of ['reviewStoryPageShell', 'sanitizePageImage', 'applyStoryContentCorrections', 'buildPages', '.replace(']) {
            if (finalIndex.includes(forbidden)) throw new Error(`index.ts still contains ${forbidden}`);
          }
          if (fs.readFileSync(path.join(adamRoot, 'en/languageFocus3.ts'), 'utf8').includes('adamB2LanguageReviewExercises')) throw new Error('English review still duplicated in languageFocus3.ts');
          if (fs.readFileSync(path.join(adamRoot, 'ar/languageFocus3.ts'), 'utf8').includes('adamB2LanguageReviewExercisesAr')) throw new Error('Arabic review still duplicated in languageFocus3.ts');
          if (!fs.readFileSync(enExercisesPath, 'utf8').includes('export const adamB2LanguageReviewExercises')) throw new Error('English review missing from exercises.ts');
          if (!fs.readFileSync(arExercisesPath, 'utf8').includes('export const adamB2LanguageReviewExercisesAr')) throw new Error('Arabic review missing from exercises.ts');
          TSX
          npx tsx /tmp/finalize-adam-b2.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit canonical Adam B2 and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'yunusemreyilmaz93-pixel'
          git config user.email 'yunusemreyilmaz93@gmail.com'
          git rm .github/workflows/adam-b2-finalize.yml
          git add src/data/adam/b2
          git commit -m 'Finalize canonical Adam B2 architecture'
          git push origin HEAD:preview

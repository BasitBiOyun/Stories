name: TEMP Phosphor Migration Simple

on:
  push:
    branches:
      - ui-phosphor-responsive

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-phosphor-responsive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock @phosphor-icons/core@2.1.1
      - run: node scripts/migrations/applyPhosphor.mjs
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run quality
      - name: Commit migration
        run: |
          rm -f scripts/migrations/applyPhosphor.mjs
          rm -f .github/workflows/temp-phosphor-migrate-simple.yml
          rm -f .github/workflows/temp-apply-phosphor.yml
          rm -f .github/workflows/temp-apply-phosphor-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apply Phosphor icon system"
          git push origin HEAD:ui-phosphor-responsive

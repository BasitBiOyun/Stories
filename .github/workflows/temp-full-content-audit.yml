name: TEMP Full Content Audit

on:
  push:
    branches: [story-language-lock-rollout]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run full validation
        run: npm run validate
      - name: Typecheck
        run: npm run typecheck

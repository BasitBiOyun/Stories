name: TEMP Arabic Plan Labels

on:
  push:
    branches: [story-language-lock-rollout]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Localize plan letters in Teacher Guide
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/layout/TeacherGuide.tsx')
          s = p.read_text()
          replacements = {
              "{t('tg.plans')} A: {metadata?.implementationPlans?.optionA.title}": "{t('tg.plans')} {language === 'ar' ? 'أ' : 'A'}: {metadata?.implementationPlans?.optionA.title}",
              "{t('tg.plans')} B: {metadata?.implementationPlans?.optionB.title}": "{t('tg.plans')} {language === 'ar' ? 'ب' : 'B'}: {metadata?.implementationPlans?.optionB.title}",
              "{t('tg.plans')} C: {metadata?.implementationPlans?.optionC.title}": "{t('tg.plans')} {language === 'ar' ? 'ج' : 'C'}: {metadata?.implementationPlans?.optionC.title}",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected TeacherGuide label: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/layout/TeacherGuide.tsx
          git commit -m "localize Arabic Teacher Guide plan labels"
          git push origin HEAD:story-language-lock-rollout

name: TEMP Update Rollout Validators

on:
  push:
    branches: [integration-work]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate A2 validator to derived metadata lock
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/validation/validateA2Rollout.ts')
          s = p.read_text()
          s = s.replace("import type { BookData, PageData, TeacherGuideSection } from '../../src/types';", "import type { BookData, PageData, TeacherGuideSection } from '../../src/types';\nimport { highlightPhraseOccurs } from '../../src/lib/highlightTextMatch';")
          s = s.replace("  'id', 'type', 'title', 'subtitle', 'image', 'audioUrl', 'animatedWords', 'syncPoints',", "  'id', 'type', 'title', 'subtitle', 'image', 'audioUrl', 'syncPoints',")
          needle = """    finalized.vocabulary?.forEach((entry) => {\n      assert.ok(entry.word.trim(), `${label}: chapter ${id} has an empty Word Notes word.`);\n      assert.ok(entry.definition.trim(), `${label}: chapter ${id} has an empty definition.`);\n    });\n"""
          replacement = needle + """    finalized.vocabulary?.forEach((entry) => {\n      assert.ok(\n        highlightPhraseOccurs(finalized.content, entry.word, language),\n        `${label}: Word Notes item ${entry.word} is not grounded in chapter ${id}.`,\n      );\n    });\n    finalized.animatedWords?.forEach((word) => {\n      assert.ok(\n        highlightPhraseOccurs(finalized.content, word, language),\n        `${label}: animated highlight ${word} is not grounded in chapter ${id}.`,\n      );\n    });\n"""
          if needle not in s:
              raise SystemExit('A2 validator insertion point not found')
          s = s.replace(needle, replacement)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validation/validateA2Rollout.ts
          git commit -m "align A2 rollout validator with final language lock"
          git push origin HEAD:integration-work
